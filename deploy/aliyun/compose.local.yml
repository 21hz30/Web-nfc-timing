services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: timing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d timing"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - timing-postgres-data:/var/lib/postgresql/data

  migrate:
    image: postgres:17.6-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD}
      TARGET_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/timing
    entrypoint: ["/bin/sh", "/deploy/scripts/migrate.sh"]
    volumes:
      - ../../supabase/migrations:/migrations:ro
      - .:/deploy:ro

  postgrest:
    image: postgrest/postgrest:v14.5
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_SCHEMAS: public
      PGRST_DB_URI: postgresql://timing_authenticator:${AUTHENTICATOR_PASSWORD}@postgres:5432/timing
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}

  timing-api:
    build:
      context: ../..
      dockerfile: deploy/aliyun/Dockerfile.api
    depends_on:
      - postgrest
    environment:
      DATABASE_REST_SERVICE_KEY: ${DATABASE_REST_SERVICE_KEY}
      DATABASE_REST_URL: http://postgrest:3000/
      LEADERBOARD_CLEAR_CODE: ${LEADERBOARD_CLEAR_CODE}
      TIMING_PUBLIC_KEY: ${TIMING_PUBLIC_KEY}
      TIMING_ENVIRONMENT: development
      TIMING_STORAGE_PROVIDER: aliyun-postgres

  web:
    build:
      context: ../..
      dockerfile: deploy/aliyun/Dockerfile.web
    depends_on:
      - timing-api
    ports:
      - "8789:8080"

volumes:
  timing-postgres-data:
