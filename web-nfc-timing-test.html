<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SRC 手机 NFC 打卡</title>
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/src-logo.png">
  <link rel="apple-touch-icon" href="./assets/src-logo.png">
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --bg: #f3f5f7;
      --surface: #ffffff;
      --surface-strong: #101820;
      --text: #101820;
      --muted: #627080;
      --line: #d5dde6;
      --soft: #e9eef3;
      --success: #087a4b;
      --success-soft: #e4f5ed;
      --warning: #9a5b00;
      --warning-soft: #fff4d6;
      --error: #b42318;
      --error-soft: #fdebea;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input:not([type="checkbox"]),
    select {
      font: inherit;
    }

    button,
    summary {
      -webkit-tap-highlight-color: transparent;
    }

    main {
      width: min(860px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: max(14px, env(safe-area-inset-top)) 16px max(22px, env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 11px;
    }

    .brand img {
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #ffffff;
      object-fit: contain;
    }

    .brand img.is-hoka {
      width: 106px;
      padding: 8px 10px;
      border-color: #009dff;
      background: #009dff;
    }

    .brand-copy {
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
    }

    .device-meta {
      margin-top: 3px;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .icon-button {
      display: inline-grid;
      width: 44px;
      height: 44px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface);
      color: var(--text);
      font-size: 23px;
      cursor: pointer;
    }

    .role-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 15px;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface);
    }

    .role-strip span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .role-strip strong {
      text-align: right;
      font-size: 15px;
    }

    .scanner {
      display: grid;
      min-height: 330px;
      margin-top: 12px;
      padding: 22px;
      place-items: center;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      text-align: center;
      transition: border-color 160ms ease, background 160ms ease;
    }

    .scanner[data-tone="ready"] {
      border-color: #7b8794;
    }

    .scanner[data-tone="busy"] {
      border-color: var(--warning);
      background: var(--warning-soft);
    }

    .scanner[data-tone="success"] {
      border-color: var(--success);
      background: var(--success-soft);
    }

    .scanner[data-tone="error"] {
      border-color: var(--error);
      background: var(--error-soft);
    }

    .scanner-content {
      display: grid;
      width: 100%;
      max-width: 650px;
      gap: 12px;
      justify-items: center;
    }

    .scan-state {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .scan-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #8a95a1;
    }

    body.scanning .scan-dot {
      background: var(--success);
      box-shadow: 0 0 0 5px rgba(8, 122, 75, 0.12);
    }

    .scanner h2 {
      margin: 0;
      font-size: 42px;
      line-height: 1.12;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .scanner p {
      margin: 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.5;
    }

    .last-result {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px 16px;
      align-items: center;
      margin-top: 12px;
      padding: 13px 14px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .last-result-copy {
      min-width: 0;
    }

    .last-result span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .last-result strong {
      display: block;
      margin-top: 4px;
      overflow: hidden;
      font-size: 18px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .last-time {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 14px;
      font-weight: 800;
    }

    .actions {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      margin-top: 14px;
    }

    button.command {
      min-height: 52px;
      border: 0;
      border-radius: 7px;
      padding: 12px 16px;
      background: var(--surface-strong);
      color: #ffffff;
      font-weight: 900;
      cursor: pointer;
    }

    button.command.secondary {
      min-width: 112px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
    }

    .voice-setting {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: stretch;
    }

    .checkbox-setting {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      gap: 9px;
      align-items: center;
      min-height: 46px;
      border: 1px solid #bec9d4;
      border-radius: 6px;
      padding: 8px 10px;
      background: var(--surface);
      cursor: pointer;
    }

    .checkbox-setting input {
      width: 20px;
      height: 20px;
      margin: 0;
      accent-color: var(--success);
    }

    .checkbox-setting span {
      display: grid;
      gap: 2px;
    }

    .checkbox-setting small {
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      line-height: 1.3;
    }

    .setting-button {
      min-width: 82px;
      border: 1px solid #bec9d4;
      border-radius: 6px;
      padding: 8px 10px;
      background: var(--surface-strong);
      color: #ffffff;
      font-weight: 900;
      cursor: pointer;
    }

    .setting-button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .status {
      margin-top: 10px;
      min-height: 42px;
      padding: 10px 12px;
      border-left: 4px solid #7b8794;
      background: var(--soft);
      color: #344150;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.45;
    }

    .status[data-tone="success"] {
      border-color: var(--success);
      background: var(--success-soft);
      color: #075f3d;
    }

    .status[data-tone="warning"] {
      border-color: var(--warning);
      background: var(--warning-soft);
      color: #744500;
    }

    .status[data-tone="error"] {
      border-color: var(--error);
      background: var(--error-soft);
      color: #8f1c14;
    }

    details {
      margin-top: 16px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: transparent;
    }

    summary {
      padding: 14px 2px;
      color: #344150;
      font-weight: 900;
      cursor: pointer;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      padding: 0 0 16px;
    }

    label {
      display: grid;
      gap: 6px;
      color: #344150;
      font-size: 13px;
      font-weight: 800;
    }

    input,
    select {
      width: 100%;
      min-height: 46px;
      border: 1px solid #bec9d4;
      border-radius: 6px;
      padding: 10px 11px;
      background: var(--surface);
      color: var(--text);
    }

    .hidden {
      display: none !important;
    }

    .history {
      margin-top: 18px;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 17px;
    }

    .text-button {
      border: 0;
      padding: 6px;
      background: transparent;
      color: var(--muted);
      font-weight: 800;
      cursor: pointer;
    }

    .table-wrap {
      margin-top: 10px;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface);
    }

    table {
      width: 100%;
      min-width: 620px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 10px;
      border-bottom: 1px solid #e1e7ed;
      text-align: left;
      font-size: 13px;
      vertical-align: top;
    }

    th {
      background: #edf1f5;
      color: #344150;
      font-weight: 900;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .result-status {
      font-weight: 900;
    }

    .result-status.success {
      color: var(--success);
    }

    .result-status.warning {
      color: var(--warning);
    }

    .result-status.error {
      color: var(--error);
    }

    .feedback {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      padding: 26px;
      place-items: center;
      background: var(--success);
      color: #ffffff;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: scale(1.015);
      transition: opacity 100ms ease, transform 100ms ease;
    }

    .feedback.show {
      opacity: 1;
      transform: scale(1);
    }

    .feedback[data-tone="warning"] {
      background: #9a5b00;
    }

    .feedback[data-tone="error"] {
      background: var(--error);
    }

    .feedback-content {
      display: grid;
      max-width: 720px;
      gap: 12px;
      justify-items: center;
    }

    .feedback-mark {
      display: grid;
      width: 98px;
      height: 98px;
      place-items: center;
      border: 5px solid currentColor;
      border-radius: 50%;
      font-size: 34px;
      font-weight: 950;
    }

    .feedback-kicker {
      font-size: 22px;
      font-weight: 950;
    }

    .feedback h2 {
      margin: 0;
      font-size: 50px;
      line-height: 1.08;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .feedback p {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      line-height: 1.35;
    }

    @media (max-width: 640px) {
      main {
        padding-right: 12px;
        padding-left: 12px;
      }

      .scanner {
        min-height: 310px;
        padding: 18px;
      }

      .scanner h2 {
        font-size: 34px;
      }

      .scanner p {
        font-size: 16px;
      }

      .settings-grid {
        grid-template-columns: 1fr;
      }

      .feedback h2 {
        font-size: 39px;
      }

      .feedback p {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="topbar">
      <div class="brand">
        <img id="brandLogo" src="./assets/src-logo.png" alt="SRC logo">
        <div class="brand-copy">
          <h1>手机 NFC 打卡</h1>
          <div id="deviceMeta" class="device-meta">设备尚未配置</div>
        </div>
      </div>
      <button id="fullscreenButton" class="icon-button" type="button" title="全屏" aria-label="全屏">&#x26F6;</button>
    </header>

    <div class="role-strip">
      <span>本机角色</span>
      <strong id="roleName">跑步入口（开始跑步） / RUN IN</strong>
    </div>

    <section id="scanner" class="scanner" data-tone="idle" aria-live="polite">
      <div class="scanner-content">
        <div class="scan-state"><span class="scan-dot"></span><span id="scanState">未启动</span></div>
        <h2 id="heroTitle">点击开始扫描</h2>
        <p id="heroDetail">设备启动后等待选手贴卡</p>
      </div>
    </section>

    <div class="last-result">
      <div class="last-result-copy">
        <span>最近一次</span>
        <strong id="lastResult">还没有计时记录</strong>
      </div>
      <div id="lastTime" class="last-time">--:--:--</div>
    </div>

    <div class="actions">
      <button id="startButton" class="command" type="button">开始扫描 NFC</button>
      <button id="stopButton" class="command secondary" type="button" disabled>停止</button>
    </div>

    <div id="status" class="status" data-tone="info">等待启动。</div>

    <details id="settingsPanel">
      <summary>设备设置</summary>
      <p id="raceProfileStatus" class="settings-note">正在读取比赛配置…</p>
      <div class="settings-grid">
        <label>
          比赛 / Race ID
          <select id="raceId">
            <option value="">正在读取可计时比赛场次...</option>
          </select>
        </label>
        <label>
          Device ID
          <input id="deviceId" value="timing-reader-01" autocomplete="off">
        </label>
        <label>
          计时模式
          <select id="timingMode">
            <option value="auto">自动共享闸机</option>
            <option value="manual">手动 checkpoint</option>
          </select>
        </label>
        <label id="gateRoleField">
          本机角色
          <select id="gateRole">
            <option value="RUN_IN">跑步入口（开始跑步） / RUN IN</option>
            <option value="RUN_OUT">跑步出口（结束跑步，进入站点） / RUN OUT</option>
            <option value="FINISH" hidden disabled>终点 / FINISH</option>
          </select>
        </label>
        <label id="stationField" class="hidden">
          Manual checkpoint
          <select id="stationId">
            <option value="START">START</option>
            <option value="STATION_1_ENTER">Station 1 Enter</option>
            <option value="STATION_1_EXIT">Station 1 Exit</option>
            <option value="STATION_2_ENTER">Station 2 Enter</option>
            <option value="STATION_2_EXIT">Station 2 Exit</option>
            <option value="STATION_3_ENTER">Station 3 Enter</option>
            <option value="STATION_3_EXIT">Station 3 Exit</option>
            <option value="STATION_4_ENTER">Station 4 Enter</option>
            <option value="STATION_4_EXIT">Station 4 Exit</option>
            <option value="STATION_5_ENTER">Station 5 Enter</option>
            <option value="STATION_5_EXIT">Station 5 Exit</option>
            <option value="STATION_6_ENTER">Station 6 Enter</option>
            <option value="STATION_6_EXIT">Station 6 Exit</option>
            <option value="STATION_7_ENTER">Station 7 Enter</option>
            <option value="STATION_7_EXIT">Station 7 Exit</option>
            <option value="STATION_8_ENTER">Station 8 Enter</option>
            <option value="STATION_8_EXIT">Station 8 Exit</option>
            <option value="END">END</option>
          </select>
        </label>
        <label>
          重复刷卡保护（秒）
          <input id="duplicateProtectionSeconds" type="number" min="3" max="60" step="1" value="10" inputmode="numeric">
        </label>
        <div class="voice-setting">
          <label class="checkbox-setting">
            <input id="voiceEnabled" type="checkbox" checked>
            <span>
              语音播报
              <small>播报成功结果、错误原因和下一步操作</small>
            </span>
          </label>
          <button id="testVoiceButton" class="setting-button" type="button">测试语音</button>
        </div>
        <div class="voice-setting">
          <div>
            <strong>设备绑定</strong>
            <small id="deviceBindingStatus">请确认 Device ID 与本机角色后再开始扫描。</small>
          </div>
          <button id="bindDeviceButton" class="setting-button" type="button">绑定本机角色</button>
        </div>
      </div>
    </details>

    <section class="history">
      <div class="section-heading">
        <h2>本机记录</h2>
        <button id="clearButton" class="text-button" type="button">清空显示</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>时间</th>
              <th>选手</th>
              <th>Checkpoint</th>
              <th>结果</th>
            </tr>
          </thead>
          <tbody id="eventsBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <audio id="successVoiceAudio" preload="auto" src="./assets/check-in-success.wav" aria-hidden="true"></audio>

  <div id="feedback" class="feedback" data-tone="success" role="status" aria-live="assertive" aria-hidden="true">
    <div class="feedback-content">
      <div id="feedbackMark" class="feedback-mark">OK</div>
      <div id="feedbackKicker" class="feedback-kicker">打卡成功</div>
      <h2 id="feedbackTitle">-</h2>
      <p id="feedbackDetail">-</p>
    </div>
  </div>

  <script src="./timing-api.js"></script>
  <script>
    const elements = {
      clearButton: document.querySelector("#clearButton"),
      deviceId: document.querySelector("#deviceId"),
      deviceMeta: document.querySelector("#deviceMeta"),
      duplicateProtectionSeconds: document.querySelector("#duplicateProtectionSeconds"),
      eventsBody: document.querySelector("#eventsBody"),
      feedback: document.querySelector("#feedback"),
      feedbackDetail: document.querySelector("#feedbackDetail"),
      feedbackKicker: document.querySelector("#feedbackKicker"),
      feedbackMark: document.querySelector("#feedbackMark"),
      feedbackTitle: document.querySelector("#feedbackTitle"),
      fullscreenButton: document.querySelector("#fullscreenButton"),
      gateRole: document.querySelector("#gateRole"),
      gateRoleField: document.querySelector("#gateRoleField"),
      heroDetail: document.querySelector("#heroDetail"),
      heroTitle: document.querySelector("#heroTitle"),
      lastResult: document.querySelector("#lastResult"),
      lastTime: document.querySelector("#lastTime"),
      raceId: document.querySelector("#raceId"),
      roleName: document.querySelector("#roleName"),
      scanner: document.querySelector("#scanner"),
      scanState: document.querySelector("#scanState"),
      settingsPanel: document.querySelector("#settingsPanel"),
      startButton: document.querySelector("#startButton"),
      stationField: document.querySelector("#stationField"),
      stationId: document.querySelector("#stationId"),
      status: document.querySelector("#status"),
      stopButton: document.querySelector("#stopButton"),
      successVoiceAudio: document.querySelector("#successVoiceAudio"),
      testVoiceButton: document.querySelector("#testVoiceButton"),
      timingMode: document.querySelector("#timingMode"),
      voiceEnabled: document.querySelector("#voiceEnabled"),
      raceProfileStatus: document.querySelector("#raceProfileStatus")
      ,deviceBindingStatus: document.querySelector("#deviceBindingStatus")
      ,bindDeviceButton: document.querySelector("#bindDeviceButton")
      ,brandLogo: document.querySelector("#brandLogo")
    };

    const settingsKey = "srcNfcTimingSettingsV2";
    const templateRaceIds = new Set(["fitmonster-hyrox-single", "hoka-race"]);
    const duplicateWindowMs = 2500;
    const defaultApiUrl = "/api/timing-events";
    const startCheckinApiUrl = "/api/start-checkins";
    const recentScans = new Map();
    let abortController = null;
    let audioContext = null;
    let feedbackTimer = null;
    let ndefReader = null;
    let scanQueue = Promise.resolve();
    let speechTimer = null;
    let wakeLock = null;
    let raceProfile = null;
    let deviceBindings = [];
    let bindingConfirmed = false;

    function roleLabel(role) {
      return {
        RUN_IN: "跑步入口（开始跑步） / RUN IN",
        RUN_OUT: "跑步出口（结束跑步，进入站点） / RUN OUT",
        FINISH: "终点 / FINISH"
      }[role] || role;
    }

    function shortRoleLabel(role) {
      return {
        RUN_IN: "跑步入口",
        RUN_OUT: "跑步出口",
        FINISH: "终点"
      }[role] || role;
    }

    function isHokaRaceId(raceId) {
      return raceId === "hoka-race"
        || String(raceId || "").startsWith("hoka-race-");
    }

    function updateRaceLogo() {
      const usesHokaLogo = isHokaRaceId(elements.raceId.value.trim());
      elements.brandLogo.src = usesHokaLogo
        ? "./assets/hoka-logo-white.png"
        : "./assets/src-logo.png";
      elements.brandLogo.alt = usesHokaLogo ? "HOKA logo" : "SRC logo";
      elements.brandLogo.classList.toggle("is-hoka", usesHokaLogo);
    }

    function usesStationBoundaries() {
      return raceProfile?.mode === "station_checkpoints"
        && Array.isArray(raceProfile.checkpoints)
        && !raceProfile.checkpoints.includes("STATION_1_START");
    }

    function checkpointLabel(checkpoint) {
      if (checkpoint === "START") {
        return usesStationBoundaries() ? "比赛开始 / START" : "开始第 1 圈跑步";
      }
      if (checkpoint === "END") {
        return usesStationBoundaries() ? "最终结束 / FINAL END" : "正式完赛";
      }
      if (checkpoint === "AUTO_RUN_OUT") return "跑步出口 · 未推进";
      if (checkpoint === "AUTO_RUN_IN") return "跑步入口 · 未推进";
      if (checkpoint === "AUTO_FINISH") return "终点 · 未推进";
      if (checkpoint === "AUTO") return "等待服务器自动判定";

      const match = String(checkpoint || "").match(/^STATION_(\d+)_(ENTER|EXIT|START)$/);
      if (!match) return checkpoint || "未分配 checkpoint";

      const stationNumber = Number(match[1]);
      if (match[2] === "START") {
        if (usesStationBoundaries() && stationNumber > 1) {
          const completedStation = stationNumber - 1;
          return `第 ${completedStation} 站结束 / STATION ${completedStation} END`;
        }
        return "第 " + stationNumber + " 站打卡";
      }
      if (match[2] === "ENTER") {
        return `第 ${stationNumber} 圈跑步完成 · 进入第 ${stationNumber} 站`;
      }
      return `第 ${stationNumber} 站完成 · 开始第 ${stationNumber + 1} 圈跑步`;
    }

    function ensureRaceOption(raceId) {
      if (!raceId || templateRaceIds.has(raceId)) return;
      const existing = Array.from(elements.raceId.options)
        .find((option) => option.value === raceId);
      if (existing) return;
      const savedGroup = document.createElement("optgroup");
      savedGroup.label = "保存的比赛";
      savedGroup.dataset.raceGroup = "saved";
      savedGroup.append(new Option(raceId, raceId));
      elements.raceId.append(savedGroup);
    }

    function loadSettings() {
      let saved = {};
      try {
        saved = JSON.parse(localStorage.getItem(settingsKey) || "{}");
      } catch (error) {
        saved = {};
      }

      const params = new URLSearchParams(window.location.search);
      const preferredRaceId = params.get("raceId")
        || saved.raceId
        || "";
      ensureRaceOption(preferredRaceId);
      elements.raceId.value = preferredRaceId;
      elements.deviceId.value = params.get("deviceId") || saved.deviceId || "timing-reader-01";
      elements.timingMode.value = params.get("timingMode") || params.get("mode") || saved.timingMode || "auto";
      elements.gateRole.value = params.get("role") || saved.gateRole || "RUN_IN";
      elements.stationId.value = params.get("checkpoint")
        || params.get("stationId")
        || saved.stationId
        || "START";
      elements.duplicateProtectionSeconds.value = params.get("duplicateWindowSeconds") || saved.duplicateProtectionSeconds || "10";
      const voiceParam = params.get("voice");
      elements.voiceEnabled.checked = voiceParam === null
        ? saved.voiceEnabled !== false
        : !["0", "false", "off"].includes(voiceParam.toLowerCase());
    }

    function saveSettings() {
      localStorage.setItem(settingsKey, JSON.stringify({
        deviceId: elements.deviceId.value.trim(),
        duplicateProtectionSeconds: elements.duplicateProtectionSeconds.value,
        gateRole: elements.gateRole.value,
        raceId: elements.raceId.value.trim(),
        stationId: elements.stationId.value,
        timingMode: elements.timingMode.value,
        voiceEnabled: elements.voiceEnabled.checked
      }));
    }

    function raceConfigUrl() {
      return "/api/race-config";
    }

    function racesUrl() {
      return "/api/races";
    }

    async function readApiResponse(response) {
      const responseText = await response.text();
      const contentType = response.headers.get("content-type") || "";
      if (!contentType.includes("application/json")) {
        throw new Error(`计时服务器暂时不可用（HTTP ${response.status}），请稍后刷新页面重试`);
      }
      try {
        return responseText ? JSON.parse(responseText) : {};
      } catch (error) {
        throw new Error(`计时服务器返回格式错误（HTTP ${response.status}）`);
      }
    }

    function raceOptionLabel(race) {
      const usesStationBoundaries = race.checkpointLayout === "station_boundaries"
        || (
          race.mode === "station_checkpoints"
          && Array.isArray(race.checkpoints)
          && !race.checkpoints.includes("STATION_1_START")
        );
      const layout = race.mode === "three_reader_auto"
        ? `${race.stationCount} 站 / 3 手机`
        : race.mode === "station_checkpoints"
          ? `${race.stationCount} 站 / ${race.stationCount + (usesStationBoundaries ? 1 : 2)} 手机`
          : `${race.stationCount} 站 / 2 手机`;
      return `${race.name || race.raceId} · ${layout}`;
    }

    function createRaceOptionGroup(label, races) {
      const group = document.createElement("optgroup");
      group.label = label;
      races.forEach((race) => {
        group.append(new Option(raceOptionLabel(race), race.raceId));
      });
      return group;
    }

    async function loadRaceOptions() {
      const selectedRaceId = elements.raceId.value;
      const response = await window.timingApiFetch(racesUrl());
      const payload = await readApiResponse(response);
      if (!response.ok || !payload.ok || !Array.isArray(payload.races)) {
        throw new Error(payload.error || ("HTTP " + response.status));
      }

      const activeRaces = payload.races.filter((race) => (
        race?.raceId
        && !race.isTemplate
        && !templateRaceIds.has(race.raceId)
        && race.status !== "finalized"
      ));
      const datedRaces = activeRaces
        .filter((race) => Array.from(templateRaceIds).some(
          (templateId) => race.raceId.startsWith(`${templateId}-`)
        ))
        .sort((left, right) => right.raceId.localeCompare(left.raceId));
      const otherRaces = activeRaces
        .filter((race) => !datedRaces.includes(race))
        .sort((left, right) => raceOptionLabel(left).localeCompare(raceOptionLabel(right)));
      const groups = [];
      if (datedRaces.length) {
        groups.push(createRaceOptionGroup("可计时比赛场次", datedRaces));
      }
      if (otherRaces.length) {
        groups.push(createRaceOptionGroup("其他 / 测试比赛", otherRaces));
      }
      if (!groups.length) {
        const emptyOption = new Option("暂无可计时场次，请先到前台创建", "");
        emptyOption.disabled = true;
        emptyOption.selected = true;
        groups.push(emptyOption);
      }
      elements.raceId.replaceChildren(...groups);
      const activeIds = new Set(activeRaces.map((race) => race.raceId));
      elements.raceId.value = activeIds.has(selectedRaceId)
        ? selectedRaceId
        : datedRaces[0]?.raceId || otherRaces[0]?.raceId || "";
    }

    function renderRaceCheckpoints(checkpoints, preferredCheckpoint) {
      elements.stationId.replaceChildren(
        ...checkpoints.map((checkpoint) => {
          return new Option(checkpointLabel(checkpoint), checkpoint);
        })
      );
      elements.stationId.value = checkpoints.includes(preferredCheckpoint)
        ? preferredCheckpoint
        : checkpoints[0];
    }

    async function loadRaceProfile() {
      const raceId = elements.raceId.value.trim();
      if (!raceId) return;
      const params = new URLSearchParams(window.location.search);
      const response = await window.timingApiFetch(
        raceConfigUrl() + "?raceId=" + encodeURIComponent(raceId)
      );
      const payload = await readApiResponse(response);
      if (!response.ok || !payload.ok) {
        throw new Error(payload.error || ("HTTP " + response.status));
      }
      raceProfile = payload.race;
      const requestedMode = params.get("timingMode") || params.get("mode");
      elements.timingMode.value = requestedMode === "manual"
        ? "manual"
        : raceProfile.mode === "station_checkpoints"
          ? "manual"
          : "auto";
      const finishOption = elements.gateRole.querySelector('option[value="FINISH"]');
      const usesFinishReader = raceProfile.mode === "three_reader_auto";
      finishOption.hidden = !usesFinishReader;
      finishOption.disabled = !usesFinishReader;
      if (!usesFinishReader && elements.gateRole.value === "FINISH") {
        elements.gateRole.value = "RUN_IN";
      }
      renderRaceCheckpoints(
        raceProfile.checkpoints,
        params.get("checkpoint") || params.get("stationId") || elements.stationId.value
      );
      await loadDeviceBindings();
      elements.raceProfileStatus.textContent =
        raceProfile.name + " · " + raceProfile.mode
        + " · " + raceProfile.stationCount + " stations";
      elements.raceProfileStatus.dataset.tone = "success";
      renderConfiguration();
    }

    function bindingAssignment() {
      return elements.timingMode.value === "auto"
        ? elements.gateRole.value
        : elements.stationId.value;
    }

    function currentDeviceBinding() {
      const deviceId = elements.deviceId.value.trim();
      return deviceBindings.find((binding) => binding.device_id === deviceId) || null;
    }

    function renderDeviceBindingAvailability() {
      const deviceId = elements.deviceId.value.trim();
      const ownBinding = currentDeviceBinding();
      if (ownBinding) {
        const assignment = elements.timingMode.value === "manual"
          ? checkpointLabel(ownBinding.assignment)
          : shortRoleLabel(ownBinding.assignment);
        elements.deviceBindingStatus.textContent = `已绑定：${ownBinding.device_id} · ${assignment}`;
        elements.deviceBindingStatus.dataset.tone = "success";
        elements.bindDeviceButton.textContent = "重新确认绑定";
      } else if (deviceId) {
        elements.deviceBindingStatus.textContent = "尚未确认；请点击“绑定本机角色”锁定当前选择。";
        elements.deviceBindingStatus.dataset.tone = "warning";
        elements.bindDeviceButton.textContent = "绑定本机角色";
      } else {
        elements.deviceBindingStatus.textContent = "请先填写 Device ID。";
        elements.bindDeviceButton.textContent = "绑定本机角色";
      }
    }

    async function loadDeviceBindings() {
      const raceId = elements.raceId.value.trim();
      if (!raceId) return;
      const response = await window.timingApiFetch(
        "/api/device-bindings?raceId=" + encodeURIComponent(raceId)
      );
      const payload = await readApiResponse(response);
      if (!response.ok || !payload.ok) throw new Error(payload.error || ("HTTP " + response.status));
      deviceBindings = Array.isArray(payload.bindings) ? payload.bindings : [];
      bindingConfirmed = Boolean(currentDeviceBinding());
      renderDeviceBindingAvailability();
    }

    async function bindDevice() {
      const deviceId = elements.deviceId.value.trim();
      const assignment = bindingAssignment();
      if (!deviceId) throw new Error("请先填写 Device ID");
      const response = await window.timingApiFetch("/api/device-bindings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ raceId: elements.raceId.value.trim(), deviceId, assignment })
      });
      const payload = await readApiResponse(response);
      if (!response.ok || !payload.ok) throw new Error(payload.error || ("HTTP " + response.status));
      await loadDeviceBindings();
      bindingConfirmed = true;
      const assignmentLabel = elements.timingMode.value === "manual"
        ? checkpointLabel(assignment)
        : shortRoleLabel(assignment);
      setStatus(`设备绑定成功：${deviceId} · ${assignmentLabel}`, "success");
    }

    async function ensureDeviceBinding() {
      await loadDeviceBindings();
      const assignment = bindingAssignment();
      const ownBinding = currentDeviceBinding();
      if (!bindingConfirmed || !ownBinding || ownBinding.assignment !== assignment) {
        throw new Error("请先点击“绑定本机角色”，确认当前 Device ID 和角色");
      }
    }

    function showRaceProfileError(error) {
      elements.raceProfileStatus.textContent = "比赛配置读取失败：" + error.message;
      elements.raceProfileStatus.dataset.tone = "error";
    }

    async function refreshRaceData({ reloadOptions = false } = {}) {
      if (reloadOptions) {
        try {
          await loadRaceOptions();
        } catch (error) {
          // Keep the built-in official options available when the list request fails.
        }
      }
      await loadRaceProfile();
    }

    function renderConfiguration() {
      const isAuto = elements.timingMode.value === "auto";
      const isStartCheckin = !isAuto && elements.stationId.value === "START";
      updateRaceLogo();
      elements.gateRoleField.classList.toggle("hidden", !isAuto);
      elements.stationField.classList.toggle("hidden", isAuto);
      elements.roleName.textContent = isAuto
        ? roleLabel(elements.gateRole.value)
        : `手动 · ${checkpointLabel(elements.stationId.value)}`;
      elements.deviceMeta.textContent = `${elements.raceId.value.trim() || "No race"} · ${elements.deviceId.value.trim() || "No device"}`;
      elements.startButton.textContent = isStartCheckin ? "开始起点核验" : "开始扫描 NFC";
      elements.testVoiceButton.disabled = !elements.voiceEnabled.checked;
      if (!document.body.classList.contains("scanning")) renderReadyState();
      saveSettings();
    }

    function renderReadyState() {
      const isAuto = elements.timingMode.value === "auto";
      const isStartCheckin = !isAuto && elements.stationId.value === "START";
      elements.scanner.dataset.tone = document.body.classList.contains("scanning") ? "ready" : "idle";
      elements.scanState.textContent = document.body.classList.contains("scanning") ? "正在扫描" : "未启动";
      if (!document.body.classList.contains("scanning")) {
        elements.heroTitle.textContent = isStartCheckin ? "点击开始核验" : "点击开始扫描";
        elements.heroDetail.textContent = isStartCheckin
          ? "起点只做核验，等待裁判发枪后开始计时"
          : "设备启动后等待选手贴卡";
        return;
      }

      if (isAuto && elements.gateRole.value === "FINISH") {
        elements.heroTitle.textContent = "冲过终点后请贴卡";
        elements.heroDetail.textContent = "看到正式完赛提示后再离开";
      } else if (isAuto && elements.gateRole.value === "RUN_OUT") {
        elements.heroTitle.textContent = "跑步结束后请贴卡";
        elements.heroDetail.textContent = "打卡后进入功能站，听到提示音再离开";
      } else if (isAuto) {
        elements.heroTitle.textContent = "开始跑步前请贴卡";
        elements.heroDetail.textContent = "打卡后开始 500m 跑步，听到提示音再离开";
      } else if (isStartCheckin) {
        elements.heroTitle.textContent = "请贴 NFC 卡核验";
        elements.heroDetail.textContent = "核验通过后等待裁判发枪";
      } else {
        elements.heroTitle.textContent = "请贴 NFC 卡";
        elements.heroDetail.textContent = checkpointLabel(elements.stationId.value);
      }
    }

    function setStatus(message, tone = "info") {
      elements.status.textContent = message;
      elements.status.dataset.tone = tone;
    }

    function setBusy(cardCode) {
      elements.scanner.dataset.tone = "busy";
      elements.scanState.textContent = "正在写入服务器";
      elements.heroTitle.textContent = cardCode;
      elements.heroDetail.textContent = "请保持卡片移开，等待确认";
    }

    function decodeRecord(record) {
      if (!record.data) return "";
      if (record.recordType === "text") {
        return new TextDecoder(record.encoding || "utf-8").decode(record.data);
      }
      return new TextDecoder("utf-8").decode(record.data);
    }

    function readCardCode(message) {
      for (const record of message.records) {
        const value = decodeRecord(record).trim().toUpperCase();
        if (value) return value;
      }
      return "";
    }

    function getStationMeta(stationId) {
      if (stationId === "START") return { stationNumber: null, checkpointType: "start" };
      if (stationId === "END") return { stationNumber: null, checkpointType: "end" };
      const match = stationId.match(/^STATION_(\d+)_(ENTER|EXIT|START)$/);
      if (!match) return { stationNumber: null, checkpointType: "unknown" };
      return {
        stationNumber: Number(match[1]),
        checkpointType: match[2].toLowerCase()
      };
    }

    function buildPayload(cardCode, serialNumber) {
      const isAuto = elements.timingMode.value === "auto";
      const stationId = isAuto ? "AUTO" : elements.stationId.value;
      const stationMeta = getStationMeta(stationId);
      return {
        eventId: `${elements.deviceId.value.trim()}-${Date.now()}-${Math.random().toString(16).slice(2)}`,
        raceId: elements.raceId.value.trim(),
        deviceId: elements.deviceId.value.trim(),
        timingMode: elements.timingMode.value,
        gateRole: isAuto ? elements.gateRole.value : "",
        duplicateWindowSeconds: Number(elements.duplicateProtectionSeconds.value),
        stationId,
        stationLabel: isAuto ? roleLabel(elements.gateRole.value) : elements.stationId.options[elements.stationId.selectedIndex].text,
        stationNumber: stationMeta.stationNumber,
        checkpointType: stationMeta.checkpointType,
        cardCode,
        serialNumber: serialNumber || "",
        eventTime: new Date().toISOString(),
        source: "web-nfc-gate"
      };
    }

    async function uploadEvent(payload) {
      const isStartCheckin = payload.timingMode === "manual" && payload.stationId === "START";
      const response = await window.timingApiFetch(isStartCheckin ? startCheckinApiUrl : defaultApiUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(isStartCheckin
          ? {
              raceId: payload.raceId,
              cardCode: payload.cardCode,
              deviceId: payload.deviceId
            }
          : payload)
      });
      const responsePayload = await readApiResponse(response);

      if (!response.ok) {
        throw new Error(responsePayload?.error || `HTTP ${response.status}`);
      }
      return responsePayload;
    }

    async function unlockAudio() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      if (!audioContext) audioContext = new AudioContextClass();
      if (audioContext.state === "suspended") await audioContext.resume();
    }

    function playTone(tone) {
      if (!audioContext || audioContext.state !== "running") return;
      const notes = tone === "success"
        ? [{ frequency: 880, offset: 0 }, { frequency: 1175, offset: 0.16 }]
        : tone === "warning"
          ? [{ frequency: 520, offset: 0 }]
          : [{ frequency: 220, offset: 0 }, { frequency: 180, offset: 0.2 }];

      notes.forEach(({ frequency, offset }) => {
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        const startAt = audioContext.currentTime + offset;
        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(frequency, startAt);
        gain.gain.setValueAtTime(0.0001, startAt);
        gain.gain.exponentialRampToValueAtTime(0.45, startAt + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, startAt + 0.13);
        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        oscillator.start(startAt);
        oscillator.stop(startAt + 0.15);
      });
    }

    function speakSystemMessage(message) {
      if (!("speechSynthesis" in window) || !("SpeechSynthesisUtterance" in window)) {
        return false;
      }

      window.clearTimeout(speechTimer);
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(message);
      utterance.lang = "zh-CN";
      utterance.rate = 1.12;
      utterance.pitch = 1;
      utterance.volume = 1;
      const voices = window.speechSynthesis.getVoices();
      const chineseVoice = voices.find((voice) => voice.lang.toLowerCase().startsWith("zh-cn"))
        || voices.find((voice) => voice.lang.toLowerCase().startsWith("zh"));
      if (chineseVoice) utterance.voice = chineseVoice;
      window.speechSynthesis.speak(utterance);
      return true;
    }

    async function playSuccessVoice() {
      if (!elements.voiceEnabled.checked) return false;

      try {
        elements.successVoiceAudio.pause();
        elements.successVoiceAudio.currentTime = 0;
        elements.successVoiceAudio.volume = 1;
        await elements.successVoiceAudio.play();
        return true;
      } catch (error) {
        return speakSystemMessage("打卡成功");
      }
    }

    async function unlockSuccessVoice() {
      if (!elements.voiceEnabled.checked) return;
      const wasMuted = elements.successVoiceAudio.muted;
      elements.successVoiceAudio.muted = true;
      try {
        await elements.successVoiceAudio.play();
        elements.successVoiceAudio.pause();
        elements.successVoiceAudio.currentTime = 0;
      } catch (error) {
        // The test button remains available if the browser blocks media priming.
      } finally {
        elements.successVoiceAudio.muted = wasMuted;
      }
    }

    function announceSuccess() {
      window.clearTimeout(speechTimer);
      speechTimer = window.setTimeout(() => {
        playSuccessVoice();
      }, 320);
    }

    function announceVoice(message, delay = 220) {
      if (!elements.voiceEnabled.checked || !message) return;
      window.clearTimeout(speechTimer);
      speechTimer = window.setTimeout(() => {
        speakSystemMessage(message);
      }, delay);
    }

    function vibrate(tone) {
      if (!("vibrate" in navigator)) return;
      navigator.vibrate(tone === "success" ? [90, 60, 90] : tone === "warning" ? [140] : [280]);
    }

    function showFeedback({ tone, mark, kicker, title, detail, duration = 1500 }) {
      window.clearTimeout(feedbackTimer);
      elements.feedback.dataset.tone = tone;
      elements.feedbackMark.textContent = mark;
      elements.feedbackKicker.textContent = kicker;
      elements.feedbackTitle.textContent = title;
      elements.feedbackDetail.textContent = detail;
      elements.feedback.setAttribute("aria-hidden", "false");
      elements.feedback.classList.add("show");
      playTone(tone);
      vibrate(tone);
      feedbackTimer = window.setTimeout(() => {
        elements.feedback.classList.remove("show");
        elements.feedback.setAttribute("aria-hidden", "true");
        renderReadyState();
      }, duration);
    }

    function responseTone(status) {
      if (status === "accepted" || status === "start_ready") return "success";
      if (["duplicate_tap", "duplicate_event_id", "already_finished", "already_started", "local_only", "participant_paused"].includes(status)) return "warning";
      return "error";
    }

    function responseLabel(status) {
      const labels = {
        accepted: "已记录",
        start_ready: "核验成功",
        already_started: "已经出发",
        already_finished: "已经完赛",
        duplicate_event_id: "重复事件",
        duplicate_tap: "重复刷卡",
        invalid_progress: "进度异常",
        local_only: "仅本机",
        participant_dnf: "选手已退赛",
        participant_paused: "计时已暂停",
        unbound_card: "卡片未绑定",
        upload_failed: "上传失败",
        wrong_checkpoint: "刷卡位置错误",
        wrong_gate: "刷卡位置错误"
      };
      return labels[status] || status;
    }

    function responseVoiceMessage(status, feedback) {
      if (status === "start_ready") return "核验成功，请等待裁判发枪";
      if (status === "already_started") return "该选手已经出发";
      if (status === "wrong_gate" || status === "wrong_checkpoint") {
        return `刷卡位置错误，${feedback.detail}`;
      }
      if (status === "unbound_card") return "卡片未绑定，请联系工作人员";
      if (status === "duplicate_tap" || status === "duplicate_event_id") {
        return "重复刷卡，上一条已经记录";
      }
      if (status === "already_finished") return "该选手已经完赛";
      if (status === "invalid_progress") return "计时进度异常，请联系工作人员";
      if (status === "local_only") return "服务器未连接，本次记录只保存在本机";
      if (status === "participant_paused") return "该选手计时已暂停，请联系工作人员恢复计时";
      if (status === "participant_dnf") return "该选手已经退赛，请联系工作人员确认";
      return "刷卡失败，请联系工作人员";
    }

    function handleResponse(response, payload) {
      const status = response.status || "uploaded";
      const tone = responseTone(status);
      const athlete = response.athleteName || response.event?.athlete_name || payload.cardCode;
      const stationId = response.stationId || response.event?.station_id || payload.stationId;
      const checkpoint = checkpointLabel(stationId);
      let feedback = {
        tone,
        mark: tone === "success" ? "OK" : tone === "warning" ? "!" : "X",
        kicker: responseLabel(status),
        title: athlete,
        detail: checkpoint,
        duration: tone === "error" ? 2400 : 1600
      };

      if (status === "wrong_gate") {
        const expectedRole = shortRoleLabel(response.expectedRole);
        feedback.detail = expectedRole
          ? `请到${expectedRole}刷卡`
          : "请到正确闸机刷卡";
      } else if (status === "wrong_checkpoint") {
        feedback.detail = response.expectedCheckpoint
          ? `请到${checkpointLabel(response.expectedCheckpoint)}刷卡`
          : "请到正确站点刷卡";
      } else if (status === "unbound_card") {
        feedback.detail = `${payload.cardCode} 尚未绑定选手`;
      } else if (status === "duplicate_tap" || status === "duplicate_event_id") {
        feedback.detail = "上一条已经记录，无需再次贴卡";
      } else if (status === "already_finished") {
        feedback.detail = "该选手已经完成比赛";
      } else if (status === "invalid_progress") {
        feedback.detail = "请联系计时工作人员检查记录";
      } else if (status === "local_only") {
        feedback.detail = "服务器未连接，这条记录不会进入实时排名";
      } else if (status === "participant_paused") {
        feedback.detail = "该选手计时已暂停，请先在后台恢复计时";
      } else if (status === "participant_dnf") {
        feedback.detail = "该选手已标记退赛，本次刷卡未记录";
      } else if (status === "start_ready") {
        feedback.detail = "等待裁判发枪";
      } else if (status === "already_started") {
        feedback.detail = "该选手已经出发，无需再次核验";
      }

      elements.lastResult.textContent = `${athlete} · ${feedback.detail}`;
      elements.lastTime.textContent = new Date().toLocaleTimeString([], { hour12: false });
      elements.scanner.dataset.tone = tone === "warning" ? "busy" : tone;
      setStatus(`${responseLabel(status)}：${athlete} · ${feedback.detail}`, tone);
      showFeedback(feedback);
      if (status === "accepted") {
        announceSuccess();
      } else if (status === "start_ready") {
        announceVoice(responseVoiceMessage(status, feedback));
      } else {
        announceVoice(responseVoiceMessage(status, feedback));
      }
      addRow(payload, response, tone);
    }

    function addCell(row, value, className = "") {
      const cell = document.createElement("td");
      cell.textContent = value;
      if (className) cell.className = className;
      row.appendChild(cell);
    }

    function addRow(payload, response, tone) {
      const row = document.createElement("tr");
      const athlete = response.athleteName || response.event?.athlete_name || payload.cardCode;
      const stationId = response.stationId || response.event?.station_id || payload.stationId;
      addCell(row, new Date(payload.eventTime).toLocaleTimeString([], { hour12: false }), "mono");
      addCell(row, athlete);
      addCell(row, checkpointLabel(stationId));
      addCell(row, responseLabel(response.status || "uploaded"), `result-status ${tone}`);
      elements.eventsBody.prepend(row);
    }

    function queueReading(event) {
      const cardCode = readCardCode(event.message);
      if (!cardCode) {
        setStatus("读到了 NFC，但没有找到卡号文本。", "error");
        announceVoice("没有读取到卡号，请将卡片移开后重新贴卡");
        showFeedback({
          tone: "error",
          mark: "X",
          kicker: "读取失败",
          title: "请重新贴卡",
          detail: "NFC tag 内没有可读取的文本卡号",
          duration: 2400
        });
        return;
      }

      const locationKey = elements.timingMode.value === "auto"
        ? elements.gateRole.value
        : elements.stationId.value;
      const duplicateKey = `${locationKey}:${cardCode}`;
      const now = Date.now();
      const previous = recentScans.get(duplicateKey) || 0;
      if (now - previous < duplicateWindowMs) {
        setStatus(`卡片仍在感应区，已忽略：${cardCode}`, "warning");
        announceVoice("卡片仍在感应区，请移开后再贴卡");
        return;
      }
      recentScans.set(duplicateKey, now);

      const payload = buildPayload(cardCode, event.serialNumber);
      scanQueue = scanQueue
        .then(async () => {
          setBusy(cardCode);
          const response = await uploadEvent(payload);
          handleResponse(response, payload);
        })
        .catch((error) => {
          elements.scanner.dataset.tone = "error";
          elements.lastResult.textContent = `${cardCode} · 上传失败`;
          elements.lastTime.textContent = new Date().toLocaleTimeString([], { hour12: false });
          setStatus(`未记录：${error.message}`, "error");
          announceVoice("上传失败，本次打卡没有记录，请检查网络后重试");
          addRow(payload, { status: "upload_failed", stationId: payload.stationId }, "error");
          showFeedback({
            tone: "error",
            mark: "X",
            kicker: "没有记录",
            title: cardCode,
            detail: `上传失败：${error.message}`,
            duration: 2800
          });
        });
    }

    async function requestWakeLock() {
      if (!("wakeLock" in navigator) || document.visibilityState !== "visible") return;
      try {
        wakeLock = await navigator.wakeLock.request("screen");
      } catch (error) {
        setStatus(`扫描已启动，但无法保持屏幕常亮：${error.message}`, "warning");
      }
    }

    async function releaseWakeLock() {
      if (!wakeLock) return;
      try {
        await wakeLock.release();
      } catch (error) {
        // The lock may already be released by the browser.
      }
      wakeLock = null;
    }

    function validateConfiguration() {
      if (!elements.raceId.value.trim()) throw new Error("请填写 Race ID");
      if (!elements.deviceId.value.trim()) throw new Error("请填写 Device ID");
      const duplicateProtectionSeconds = Number(elements.duplicateProtectionSeconds.value);
      if (!Number.isInteger(duplicateProtectionSeconds) || duplicateProtectionSeconds < 3 || duplicateProtectionSeconds > 60) {
        throw new Error("重复刷卡保护必须是 3 到 60 秒的整数");
      }
    }

    function lockConfiguration(locked) {
      [
        elements.deviceId,
        elements.duplicateProtectionSeconds,
        elements.gateRole,
        elements.raceId,
        elements.stationId,
        elements.testVoiceButton,
        elements.timingMode,
        elements.voiceEnabled
      ].forEach((control) => {
        control.disabled = locked;
      });
      elements.testVoiceButton.disabled = locked || !elements.voiceEnabled.checked;
      if (locked) elements.settingsPanel.open = false;
    }

    elements.startButton.addEventListener("click", async () => {
      if (!("NDEFReader" in window)) {
        setStatus("当前浏览器不支持 Web NFC，请使用 Android Chrome 打开 HTTPS 页面。", "error");
        announceVoice("当前浏览器不支持NFC，请使用安卓Chrome浏览器");
        return;
      }

      try {
        await loadRaceProfile();
        validateConfiguration();
        await ensureDeviceBinding();
        saveSettings();
        await unlockAudio();
        await unlockSuccessVoice();
        abortController = new AbortController();
        ndefReader = new NDEFReader();
        await ndefReader.scan({ signal: abortController.signal });
        ndefReader.addEventListener("reading", queueReading);
        ndefReader.addEventListener("readingerror", () => {
          setStatus("NFC 读取失败，请将卡片移开后重新贴卡。", "error");
          announceVoice("NFC读取失败，请将卡片移开后重新贴卡");
          playTone("error");
          vibrate("error");
        });
        document.body.classList.add("scanning");
        elements.startButton.disabled = true;
        elements.stopButton.disabled = false;
        lockConfiguration(true);
        await requestWakeLock();
        renderReadyState();
        setStatus(`扫描已启动 · ${elements.roleName.textContent}`, "success");
      } catch (error) {
        abortController = null;
        ndefReader = null;
        setStatus(`无法开始扫描：${error.message}`, "error");
        announceVoice("扫描启动失败，请检查网络和NFC设置后重试");
      }
    });

    elements.stopButton.addEventListener("click", async () => {
      if (abortController) abortController.abort();
      abortController = null;
      ndefReader = null;
      document.body.classList.remove("scanning");
      elements.startButton.disabled = false;
      elements.stopButton.disabled = true;
      lockConfiguration(false);
      await releaseWakeLock();
      renderReadyState();
      setStatus("扫描已停止。", "info");
    });

    elements.clearButton.addEventListener("click", () => {
      elements.eventsBody.replaceChildren();
      recentScans.clear();
      elements.lastResult.textContent = "还没有计时记录";
      elements.lastTime.textContent = "--:--:--";
      setStatus("本机显示记录已清空，服务器原始数据未删除。", "info");
    });

    elements.fullscreenButton.addEventListener("click", async () => {
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else {
          await document.documentElement.requestFullscreen();
        }
      } catch (error) {
        setStatus(`无法进入全屏：${error.message}`, "warning");
      }
    });

    elements.testVoiceButton.addEventListener("click", async () => {
      if (await playSuccessVoice()) {
        setStatus("固定语音正在播放。", "success");
      } else {
        setStatus("当前浏览器不支持语音播报，提示音仍可正常使用。", "warning");
      }
    });

    elements.bindDeviceButton.addEventListener("click", () => {
      bindDevice().catch((error) => setStatus(`设备绑定失败：${error.message}`, "error"));
    });

    [
      elements.deviceId,
      elements.duplicateProtectionSeconds,
      elements.gateRole,
      elements.raceId,
      elements.stationId,
      elements.timingMode,
      elements.voiceEnabled
    ].forEach((control) => {
      control.addEventListener("change", renderConfiguration);
      control.addEventListener("input", () => {
        if (control.tagName === "INPUT") renderConfiguration();
      });
    });

    elements.raceId.addEventListener("change", () => {
      refreshRaceData().catch(showRaceProfileError);
    });

    [elements.deviceId, elements.gateRole, elements.stationId].forEach((control) => {
      control.addEventListener("change", () => {
        bindingConfirmed = false;
        renderDeviceBindingAvailability();
      });
      control.addEventListener("input", () => {
        bindingConfirmed = false;
        renderDeviceBindingAvailability();
      });
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && document.body.classList.contains("scanning") && !wakeLock) {
        requestWakeLock();
      }
    });

    loadSettings();
    renderConfiguration();
    refreshRaceData({ reloadOptions: true }).catch(showRaceProfileError);
  </script>
</body>
</html>
