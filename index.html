<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SRC 赛事计时</title>
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/src-logo.png">
  <link rel="apple-touch-icon" href="./assets/src-logo.png">
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f5f7;
      color: #121820;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f3f5f7;
    }

    main {
      width: min(1040px, 100%);
      margin: 0 auto;
      padding: 24px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
    }

    p {
      margin: 8px 0 0;
      color: #607080;
      line-height: 1.5;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-top: 22px;
    }

    a {
      display: grid;
      gap: 8px;
      min-height: 130px;
      padding: 16px;
      border: 1px solid #d7dee7;
      border-radius: 8px;
      background: #ffffff;
      color: #121820;
      text-decoration: none;
    }

    a strong {
      font-size: 18px;
    }

    a span {
      color: #607080;
      line-height: 1.45;
    }

    @media (max-width: 760px) {
      .links {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>SRC 赛事计时</h1>
    <p>按现场角色进入对应工作页面。</p>

    <div class="links">
      <a href="./admin.html">
        <strong>比赛与绑定</strong>
        <span>创建比赛、设置站点和出发批次，绑定选手 NFC 卡。</span>
      </a>
      <a href="./judge.html">
        <strong>裁判台</strong>
        <span>确认待发批次、统一发枪、调整成绩和处理退赛。</span>
      </a>
      <a href="./web-nfc-timing-test.html">
        <strong>手机 NFC</strong>
        <span>将手机绑定到比赛站点，完成起点核验或沿途打卡。</span>
      </a>
      <a href="./leaderboard.html">
        <strong>数据大屏</strong>
        <span>在大屏或手机查看实时排名，并按赛事品牌显示。</span>
      </a>
    </div>
  </main>
</body>
</html>
