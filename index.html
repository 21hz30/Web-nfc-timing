<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SRC 赛事计时</title>
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/src-logo.png">
  <link rel="apple-touch-icon" href="./assets/src-logo.png">
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f5f7;
      color: #121820;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f3f5f7;
    }

    main {
      width: min(900px, 100%);
      margin: 0 auto;
      padding: 24px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
    }

    p {
      margin: 8px 0 0;
      color: #607080;
      line-height: 1.5;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 22px;
    }

    a {
      display: grid;
      gap: 8px;
      min-height: 130px;
      padding: 16px;
      border: 1px solid #d7dee7;
      border-radius: 8px;
      background: #ffffff;
      color: #121820;
      text-decoration: none;
    }

    a strong {
      font-size: 18px;
    }

    a span {
      color: #607080;
      line-height: 1.45;
    }

    @media (max-width: 760px) {
      .links {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>SRC 赛事计时</h1>
    <p>选择比赛工作页面。</p>

    <div class="links">
      <a href="./admin.html">
        <strong>前台登记</strong>
        <span>登记个人、双人或团队，绑定 NFC 卡并查看比赛数据。</span>
      </a>
      <a href="./web-nfc-timing-test.html">
        <strong>站点计时</strong>
        <span>为每台安卓手机选择比赛和固定计时位置。</span>
      </a>
      <a href="./leaderboard.html">
        <strong>实时排名大屏</strong>
        <span>查看实时排名、比赛进度、总用时和每站用时。</span>
      </a>
    </div>
  </main>
</body>
</html>
