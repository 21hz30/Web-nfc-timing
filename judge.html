<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111820">
  <title>SRC 裁判台</title>
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/src-logo.png">
  <link rel="apple-touch-icon" href="./assets/src-logo.png">
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #15202b;
      background: #edf1f4;
      --brand: #111820;
      --brand-ink: #ffffff;
      --accent: #087f5b;
      --accent-ink: #ffffff;
      --surface: #ffffff;
      --line: #d6dde5;
      --muted: #687686;
      --success: #087f5b;
      --success-soft: #e1f4eb;
      --warning: #9b5a00;
      --warning-soft: #fff1d6;
      --error: #b42318;
      --error-soft: #ffe9e6;
      --info: #146da0;
      --info-soft: #e4f2fa;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; background: #edf1f4; }
    body.hoka { --brand: #009dff; --accent: #d8f000; --accent-ink: #122438; background: #009dff; }
    body.modal-open { overflow: hidden; }
    body.auth-pending { overflow: hidden; }
    body.auth-pending .app { pointer-events: none; user-select: none; }
    button, input, select, textarea { font: inherit; letter-spacing: 0; }

    .app { width: min(1240px, 100%); min-height: 100vh; margin: 0 auto; background: #edf1f4; }
    body.hoka .app { background: #009dff; }

    header {
      display: flex;
      min-height: 82px;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: calc(14px + env(safe-area-inset-top)) 18px 14px;
      background: var(--brand);
      color: var(--brand-ink);
    }
    .brand { display: flex; min-width: 0; align-items: center; gap: 13px; }
    .brand img { width: 62px; max-height: 48px; object-fit: contain; }
    h1 { margin: 0; font-size: 23px; line-height: 1.12; letter-spacing: 0; }
    .race-name { margin-top: 4px; color: rgb(255 255 255 / 76%); font-size: 12px; font-weight: 750; }
    .demo-badge { display: inline-flex; min-height: 24px; align-items: center; border: 1px solid rgb(255 255 255 / 38%); border-radius: 999px; padding: 3px 8px; color: #ffffff; font-size: 11px; font-weight: 900; }
    .demo-badge[hidden] { display: none; }
    .header-status { display: flex; align-items: center; gap: 8px; color: rgb(255 255 255 / 82%); font-size: 12px; font-weight: 800; }
    .header-status::before { width: 9px; height: 9px; border-radius: 50%; background: #8a98a5; content: ""; }
    .header-status[data-tone="live"]::before { background: var(--accent); box-shadow: 0 0 0 4px rgb(216 240 0 / 15%); }
    .header-status[data-tone="error"]::before { background: #ff6b61; }

    main { padding: 12px 14px 90px; }
    .race-bar {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) repeat(4, auto);
      gap: 9px;
      align-items: end;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface);
    }
    label { display: grid; gap: 6px; color: #364352; font-size: 12px; font-weight: 850; }
    select, input, textarea {
      width: 100%;
      min-height: 44px;
      border: 1px solid #bec9d4;
      border-radius: 6px;
      padding: 9px 10px;
      background: #ffffff;
      color: #15202b;
    }
    .responsive-select { position: relative; min-width: 0; }
    .responsive-select-trigger {
      display: none;
      width: 100%;
      min-height: 44px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 1px solid #bec9d4;
      border-radius: 6px;
      padding: 9px 10px;
      background: #ffffff;
      color: #15202b;
      font-size: 14px;
      font-weight: 800;
      text-align: left;
      cursor: pointer;
    }
    .responsive-select-trigger::after {
      width: 0;
      height: 0;
      flex: 0 0 auto;
      border-right: 5px solid transparent;
      border-left: 5px solid transparent;
      border-top: 6px solid currentColor;
      content: "";
    }
    .responsive-select-trigger[aria-expanded="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px rgb(216 240 0 / 20%); }
    .responsive-select-menu {
      position: absolute;
      z-index: 90;
      top: calc(100% + 6px);
      right: 0;
      left: 0;
      display: grid;
      max-height: min(46vh, 340px);
      overflow-y: auto;
      border: 1px solid #bec9d4;
      border-radius: 8px;
      padding: 5px;
      background: #ffffff;
      box-shadow: 0 14px 36px rgb(10 17 24 / 28%);
    }
    .responsive-select-menu.is-floating {
      position: fixed;
      z-index: 200;
      right: auto;
      left: 0;
      width: min(420px, calc(100vw - 24px));
      max-height: min(46dvh, 340px);
    }
    .responsive-select-menu[hidden] { display: none; }
    .responsive-select-option {
      min-height: 50px;
      border: 0;
      border-radius: 6px;
      padding: 10px 12px;
      background: transparent;
      color: #273746;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.3;
      text-align: left;
      cursor: pointer;
    }
    .responsive-select-option[aria-selected="true"] { background: #e8f7ef; color: #075f3d; }
    .responsive-select-option:active, .responsive-select-option:focus-visible { background: #f2fbd0; outline: 2px solid var(--accent); outline-offset: -2px; }
    textarea { min-height: 88px; resize: vertical; }
    .utility-button, .utility-link {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      border: 1px solid #c8d1db;
      border-radius: 6px;
      padding: 8px 11px;
      background: #eef2f5;
      color: #263544;
      font-size: 13px;
      font-weight: 850;
      text-decoration: none;
      cursor: pointer;
    }
    .utility-link[aria-disabled="true"] { pointer-events: none; opacity: .45; }

    .role-bar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(230px, 320px) auto;
      gap: 12px;
      align-items: end;
      margin-top: 10px;
      border-left: 5px solid var(--accent);
      border-radius: 7px;
      padding: 13px 14px;
      background: #243442;
      color: #ffffff;
    }
    .role-copy { min-width: 0; }
    .judge-nfc-control { display: flex; min-width: 230px; align-items: center; gap: 8px; }
    .judge-nfc-control button { min-height: 42px; border: 1px solid #c7d1da; border-radius: 6px; padding: 8px 12px; background: #ffffff; color: #263744; font-size: 12px; font-weight: 900; cursor: pointer; }
    .judge-nfc-control button[data-scanning="true"] { border-color: #087a4b; background: #e4f5ed; color: #076343; }
    .judge-nfc-control button:disabled { cursor: default; opacity: .5; }
    .judge-nfc-status { color: var(--muted); font-size: 11px; line-height: 1.35; }
    .judge-nfc-status[data-tone="error"] { color: var(--error); }
    .judge-nfc-status[data-tone="success"] { color: var(--success); }
    .entry-row.nfc-focused { outline: 3px solid #d97706; outline-offset: -3px; background: #fff9e8; }
    .role-kicker { color: rgb(255 255 255 / 65%); font-size: 11px; font-weight: 900; }
    .role-title { display: block; margin-top: 3px; font-size: 20px; line-height: 1.2; }
    .role-description { margin: 5px 0 0; color: rgb(255 255 255 / 74%); font-size: 12px; font-weight: 700; line-height: 1.45; }
    .role-bar label { color: rgb(255 255 255 / 78%); }
    .role-bar select { border-color: rgb(255 255 255 / 38%); background: #ffffff; font-weight: 850; }
    .role-bar select:disabled { cursor: not-allowed; opacity: .78; }
    .switch-account-button { border-color: rgb(255 255 255 / 34%); background: transparent; color: #ffffff; }
    body.hoka .role-bar { border-left-color: #d8f000; background: #172b3b; }
    body.hoka.station-two-active .role-title { color: #d8f000; }
    body.hoka.station-two-active .role-description { color: #f1fac0; }
    body.hoka.station-two-active .batch-copy strong { color: #587000; }
    body.hoka.station-two-active .row-action.primary {
      border-color: #b7cf00;
      background: #d8f000;
      color: #122438;
      box-shadow: 0 2px 0 rgb(18 36 56 / 18%);
    }
    body.hoka.station-two-active .row-action.primary:focus-visible,
    body.hoka.station-two-active .row-action.primary:hover { background: #e7ff22; }

    .queue {
      margin-top: 11px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface);
      overflow: hidden;
    }
    .queue-tabs {
      display: flex;
      overflow-x: auto;
      border-bottom: 1px solid var(--line);
      scrollbar-width: none;
    }
    .queue-tabs::-webkit-scrollbar { display: none; }
    .tab-button {
      display: inline-flex;
      min-width: 116px;
      min-height: 48px;
      flex: 1 0 auto;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 0;
      border-right: 1px solid var(--line);
      background: #f7f9fa;
      color: #536170;
      font-size: 13px;
      font-weight: 850;
      cursor: pointer;
    }
    .tab-button:last-child { border-right: 0; }
    .tab-button[hidden], .utility-link[hidden] { display: none; }
    .tab-button strong { min-width: 24px; color: #24313d; font-size: 15px; }
    .tab-button[aria-pressed="true"] { background: #243442; color: #ffffff; }
    .tab-button[aria-pressed="true"] strong { color: #ffffff; }
    .nanxi-category-tabs { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
    .nanxi-category-tabs[hidden] { display: none; }
    .nanxi-category-tabs button { min-height: 34px; border: 1px solid #d3c625; border-radius: 999px; padding: 6px 11px; background: #fffdf0; color: #665d00; font-size: 12px; font-weight: 850; cursor: pointer; }
    .nanxi-category-tabs button[aria-pressed="true"] { background: #fff04f; color: #17170d; }

    .queue-toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 11px 12px;
      border-bottom: 1px solid var(--line);
    }
    .batch-copy { color: var(--muted); font-size: 12px; font-weight: 750; text-align: right; }
    .batch-copy strong { color: #24313d; }

    .column-head, .entry-row {
      display: grid;
      grid-template-columns: 42px minmax(190px, 1fr) minmax(130px, .55fr) minmax(160px, .7fr) minmax(210px, auto);
      gap: 10px;
      align-items: center;
    }
    .column-head { min-height: 36px; padding: 7px 12px; background: #eef2f5; color: #647282; font-size: 11px; font-weight: 850; }
    .entry-row { min-height: 76px; padding: 11px 12px; border-top: 1px solid #e3e8ed; }
    .entry-row:first-child { border-top: 0; }
    .entry-row.selected { background: #eefaf5; }
    body.hoka .entry-row.selected { background: #f8ffe0; }
    .entry-check { display: grid; width: 44px; height: 44px; place-items: center; }
    .entry-check input { width: 21px; min-height: 21px; height: 21px; margin: 0; padding: 0; accent-color: var(--success); }
    .entry-name { margin: 0; font-size: 16px; line-height: 1.25; overflow-wrap: anywhere; }
    .team-code { display: inline-block; margin: 0 8px 3px 0; color: var(--brand); font-size: 17px; font-weight: 950; }
    body.hoka .team-code { color: #148300; }
    .member-names, .entry-bibs, .card-code, .state-detail { margin-top: 4px; color: var(--muted); font-size: 11px; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
    .entry-bibs { color: #24313d; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 850; }
    .entry-bibs { display: flex; flex-wrap: wrap; gap: 5px 12px; font-size: 13px; }
    .entry-bibs > div { max-width: 100%; }
    .entry-bibs strong { font-size: 16px; }
    .entry-bibs .missing-bib { color: #9b5a00; }
    .participant-summary { white-space: pre-line; overflow-wrap: anywhere; }
    .entry-category { display: inline-block; margin: 2px 7px 0 0; color: #746a00; font-size: 11px; font-weight: 900; }
    .card-code { margin-top: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .state { display: inline-flex; width: fit-content; min-height: 26px; align-items: center; border-radius: 999px; padding: 4px 8px; background: #e9eef2; color: #596776; font-size: 11px; font-weight: 900; }
    .state.ready { background: var(--success-soft); color: #076343; }
    .state.racing, .state.paused { background: var(--info-soft); color: #0a638f; }
    .state.finished { background: #e8f4de; color: #426c18; }
    .state.dnf { background: var(--error-soft); color: #9a2119; }
    .row-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
    .row-action { min-height: 44px; border: 1px solid #cbd4dc; border-radius: 5px; padding: 8px 10px; background: #ffffff; color: #344452; font-size: 12px; font-weight: 850; cursor: pointer; }
    .row-action.primary { border-color: #9bc9b7; color: #076343; }
    .row-action.danger { border-color: #e1b3af; color: var(--error); }
    .row-action:disabled { cursor: default; opacity: .45; }
    .empty-state { padding: 58px 20px; color: var(--muted); text-align: center; font-size: 14px; font-weight: 750; }
    .message { display: flex; min-height: 40px; align-items: center; justify-content: space-between; gap: 10px; margin-top: 9px; border-left: 4px solid #8493a1; padding: 7px 9px 7px 11px; background: rgb(255 255 255 / 95%); color: #41505e; font-size: 12px; font-weight: 750; }
    .message[data-tone="success"] { border-color: var(--success); color: #075f3d; }
    .message[data-tone="error"] { border-color: var(--error); color: #8f1c14; }
    .message-action { min-height: 32px; flex: 0 0 auto; border: 1px solid currentColor; border-radius: 5px; padding: 5px 9px; background: transparent; color: inherit; font-size: 11px; font-weight: 900; cursor: pointer; }

    .start-dock { position: fixed; z-index: 20; right: 0; bottom: 0; left: 0; padding: 9px 14px calc(9px + env(safe-area-inset-bottom)); background: rgb(17 24 32 / 96%); color: #ffffff; }
    .start-dock[hidden] { display: none; }
    .dock-inner { display: flex; width: min(1212px, 100%); margin: 0 auto; align-items: center; justify-content: space-between; gap: 14px; }
    .selection-count span { display: block; color: #b9c4cf; font-size: 11px; font-weight: 750; }
    .selection-count strong { display: block; margin-top: 2px; font-size: 18px; }
    .start-button { min-width: 220px; min-height: 50px; border: 0; border-radius: 6px; padding: 10px 18px; background: var(--accent); color: var(--accent-ink); font-size: 15px; font-weight: 950; cursor: pointer; }

    .modal-backdrop { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 18px; background: rgb(10 17 24 / 70%); }
    .modal-backdrop[hidden] { display: none; }
    .modal { width: min(520px, 100%); max-height: calc(100dvh - 36px); overflow-y: auto; border-radius: 7px; padding: 20px; background: #ffffff; box-shadow: 0 24px 70px rgb(0 0 0 / 28%); }
    .modal h2 { margin: 0; font-size: 20px; }
    .modal > p { margin: 7px 0 16px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .modal-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .modal-fields { display: grid; gap: 11px; }
    .modal-grid[hidden], .modal-fields[hidden] { display: none; }
    .participant-summary { margin-bottom: 12px; border-left: 3px solid #738392; padding: 8px 10px; background: #f2f5f7; color: #354351; font-size: 12px; line-height: 1.45; }
    .modal-error { min-height: 20px; margin-top: 9px; color: var(--error); font-size: 12px; font-weight: 800; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 12px; }
    .modal-button { min-height: 44px; border: 0; border-radius: 6px; padding: 9px 14px; font-weight: 900; cursor: pointer; }
    .modal-button.secondary { background: #e8edf1; color: #364554; }
    .modal-button.primary { background: var(--accent); color: var(--accent-ink); }
    .modal-button.danger { background: var(--error); color: #ffffff; }
    .modal-button:disabled { cursor: wait; opacity: .5; }

    .auth-backdrop { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 18px; background: rgb(10 17 24 / 86%); }
    .auth-backdrop[hidden] { display: none; }
    .auth-panel { width: min(430px, 100%); border-top: 5px solid var(--accent); border-radius: 7px; padding: 24px; background: #ffffff; box-shadow: 0 28px 80px rgb(0 0 0 / 38%); }
    .auth-kicker { margin-bottom: 7px; color: var(--accent); font-size: 11px; font-weight: 950; text-transform: uppercase; }
    .auth-panel h2 { margin: 0; font-size: 23px; }
    .auth-panel > p { margin: 8px 0 18px; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .auth-submit { width: 100%; min-height: 48px; margin-top: 12px; border: 0; border-radius: 6px; background: var(--brand); color: var(--brand-ink); font-weight: 950; cursor: pointer; }
    .auth-submit:disabled { cursor: wait; opacity: .55; }

    .start-confirm-modal { overflow: hidden; border-top: 6px solid #d97706; padding-top: 18px; }
    .start-confirm-head { display: flex; align-items: center; gap: 12px; }
    .start-confirm-icon { display: grid; width: 42px; height: 42px; flex: 0 0 auto; place-items: center; border-radius: 50%; background: #fff1d6; color: #9b5a00; font-size: 24px; font-weight: 950; }
    .start-confirm-head h2 { font-size: 22px; }
    .start-impact { margin: 14px 0 12px; border: 1px solid #efc37d; border-radius: 6px; padding: 12px; background: #fff8e8; color: #673b00; }
    .start-impact strong, .start-impact span { display: block; }
    .start-impact strong { font-size: 14px; }
    .start-impact span { margin-top: 4px; font-size: 12px; font-weight: 700; line-height: 1.45; }
    .start-confirm-modal .participant-summary { border-left-color: #d97706; background: #fffaf0; font-size: 13px; font-weight: 800; }
    .start-confirm-modal .modal-actions { margin-top: 18px; }
    .start-confirm-modal .modal-button { min-height: 48px; padding-right: 18px; padding-left: 18px; }
    .start-confirm-modal .confirm-start-button { min-width: 210px; background: var(--success); color: #ffffff; }

    @media (max-width: 900px) {
      .race-bar { grid-template-columns: minmax(220px, 1fr) repeat(4, auto); }
      .column-head, .entry-row { grid-template-columns: 44px minmax(150px, 1fr) minmax(135px, .7fr) minmax(180px, auto); }
      .column-head span:nth-child(3), .entry-row .card-cell { display: none; }
    }
    @media (max-width: 680px) {
      header { min-height: 76px; padding-right: 12px; padding-left: 12px; }
      .brand img { width: 52px; }
      h1 { font-size: 20px; }
      .header-status span { display: none; }
      main { padding: 9px 9px 84px; }
      .race-bar { grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 9px; }
      .race-bar label { grid-column: 1 / -1; gap: 8px; font-size: 14px; }
      .responsive-select > select { display: none; }
      .responsive-select-trigger { display: flex; min-height: 56px; padding: 12px 14px; font-size: 16px; }
      .responsive-select-option { min-height: 54px; padding: 12px 14px; font-size: 16px; }
      #raceId, #authRaceId, #authUsername {
        min-height: 56px;
        padding: 12px 14px;
        font-size: 16px;
        font-weight: 850;
        line-height: 1.3;
      }
      .auth-panel label { font-size: 14px; }
      .role-bar { grid-template-columns: 1fr auto; align-items: end; padding: 12px; }
      .role-copy { grid-column: 1 / -1; }
      .judge-nfc-control { grid-column: 1 / -1; min-width: 0; }
      .judge-nfc-control button { flex: 0 0 auto; }
      .role-title { font-size: 19px; }
      .role-bar label { min-width: 0; }
      .utility-button, .utility-link { min-width: 0; padding: 7px 6px; font-size: 11px; }
      .queue-toolbar { grid-template-columns: 1fr; }
      .queue-tabs {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        overflow: visible;
      }
      .tab-button { min-width: 0; }
      .batch-copy { text-align: left; }
      .column-head { display: none; }
      .entry-row { grid-template-columns: 44px minmax(0, 1fr) auto; gap: 8px; min-height: 104px; padding: 11px 9px; }
      .entry-row .status-cell { grid-column: 3; grid-row: 1 / span 2; justify-self: end; text-align: right; }
      .entry-row .row-actions { grid-column: 2 / -1; justify-content: flex-start; }
      .card-cell { display: none; }
      .start-button { min-width: 170px; }
      .message { align-items: flex-start; }
    }
    @media (max-width: 390px) {
      .utility-button, .utility-link { padding-right: 7px; padding-left: 7px; }
      .modal-grid { grid-template-columns: 1fr; }
      .dock-inner { gap: 9px; }
      .start-button { min-width: 154px; font-size: 14px; }
      .auth-panel { padding: 20px; }
      .start-confirm-modal .modal-actions { display: grid; grid-template-columns: 1fr; }
      .start-confirm-modal .modal-button { width: 100%; min-width: 0; }
    }
    body.nanxi { --accent:#d1ba00; --primary:#e5cc00; --brand:#fff04f; --brand-ink:#15202b; --accent-ink:#15202b; }
    body.nanxi .race-name, body.nanxi .header-status { color:#354351; }
    body.nanxi .team-code { color:#665900; }
    body.oct11 .nanxi-category-tabs button { border-color:#8ab84f; background:#f7faf0; color:#385222; }
    body.oct11 .nanxi-category-tabs button[aria-pressed="true"] { background:#8ab84f; color:#111820; }
    body.nanxi .brand-logo { width:160px; object-fit:contain; border-radius:3px; }
  </style>
</head>
<body class="auth-pending">

    function syncResponsiveSelect(select) {
      const wrapper = select?.closest(".responsive-select");
      if (!wrapper) return;
      const trigger = wrapper.querySelector(".responsive-select-trigger");
      const menu = wrapper.querySelector(".responsive-select-menu");
      if (!trigger || !menu) return;
      if (!wrapper.dataset.ready) {
        wrapper.dataset.ready = "true";
        trigger.addEventListener("click", () => {
          const isOpen = trigger.getAttribute("aria-expanded") === "true";
          document.querySelectorAll(".responsive-select-menu:not([hidden])").forEach((openMenu) => {
            openMenu.hidden = true;
            openMenu.previousElementSibling?.setAttribute("aria-expanded", "false");
          });
          menu.hidden = isOpen;
          trigger.setAttribute("aria-expanded", String(!isOpen));
          if (!isOpen) positionResponsiveSelectMenu(trigger, menu);
          if (!isOpen) menu.querySelector('[aria-selected="true"]')?.focus();
        });
        select.addEventListener("change", () => syncResponsiveSelect(select));
      }
      const selected = select.options[select.selectedIndex];
      trigger.textContent = selected?.textContent || "请选择比赛场次";
      menu.replaceChildren(...Array.from(select.options).map((option) => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "responsive-select-option";
        item.setAttribute("role", "option");
        item.setAttribute("aria-selected", String(option.value === select.value));
        item.textContent = option.textContent;
        item.addEventListener("click", () => {
          select.value = option.value;
          menu.hidden = true;
          trigger.setAttribute("aria-expanded", "false");
          select.dispatchEvent(new Event("change", { bubbles: true }));
        });
        return item;
      }));
    }

    function positionResponsiveSelectMenu(trigger, menu) {
      if (menu.hidden || window.matchMedia("(min-width: 681px)").matches) {
        menu.classList.remove("is-floating");
        menu.style.removeProperty("top");
        menu.style.removeProperty("left");
        menu.style.removeProperty("width");
        menu.style.removeProperty("max-height");
        return;
      }
      const margin = 12;
      const gap = 6;
      const rect = trigger.getBoundingClientRect();
      const viewportHeight = window.visualViewport?.height || window.innerHeight;
      const viewportWidth = window.visualViewport?.width || window.innerWidth;
      const availableBelow = Math.max(0, viewportHeight - rect.bottom - margin - gap);
      const availableAbove = Math.max(0, rect.top - margin - gap);
      const openAbove = availableBelow < 170 && availableAbove > availableBelow;
      const available = Math.max(120, openAbove ? availableAbove : availableBelow);
      const width = Math.min(420, viewportWidth - margin * 2, rect.width);
      const left = Math.min(Math.max(margin, rect.left), Math.max(margin, viewportWidth - margin - width));
      menu.classList.add("is-floating");
      menu.style.left = `${left}px`;
      menu.style.width = `${width}px`;
      menu.style.maxHeight = `${Math.min(340, available)}px`;
      menu.style.top = openAbove
        ? `${Math.max(margin, rect.top - Math.min(340, available) - gap)}px`
        : `${Math.min(viewportHeight - margin - Math.min(340, available), rect.bottom + gap)}px`;
    }

    function repositionOpenResponsiveSelectMenus() {
      document.querySelectorAll(".responsive-select-menu:not([hidden])").forEach((menu) => {
        if (window.matchMedia("(min-width: 681px)").matches) {
          menu.hidden = true;
          menu.previousElementSibling?.setAttribute("aria-expanded", "false");
          menu.classList.remove("is-floating");
          menu.style.removeProperty("top");
          menu.style.removeProperty("left");
          menu.style.removeProperty("width");
          menu.style.removeProperty("max-height");
          return;
        }
        positionResponsiveSelectMenu(menu.previousElementSibling, menu);
      });
    }

    document.addEventListener("pointerdown", (event) => {
      if (event.target.closest(".responsive-select")) return;
      document.querySelectorAll(".responsive-select-menu:not([hidden])").forEach((menu) => {
        menu.hidden = true;
        menu.previousElementSibling?.setAttribute("aria-expanded", "false");
      });
    });
    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      document.querySelectorAll(".responsive-select-menu:not([hidden])").forEach((menu) => {
        menu.hidden = true;
        menu.previousElementSibling?.setAttribute("aria-expanded", "false");
      });
    });
    window.addEventListener("resize", repositionOpenResponsiveSelectMenus, { passive: true });
    window.visualViewport?.addEventListener("resize", repositionOpenResponsiveSelectMenus, { passive: true });
    window.visualViewport?.addEventListener("scroll", repositionOpenResponsiveSelectMenus, { passive: true });

    function isHokaRace(raceId) {
      return raceId === "hoka-race"
        || String(raceId || "").startsWith("hoka-race-");
    }

    function raceDisplayName(race) {
      if (race?.raceId === "hoka-race-demo") return "HOKA 团队挑战赛 - 测试数据";
      return race?.name || race?.raceId || "未命名比赛";
    }

    function isManagedRaceId(raceId) {
      if (primaryRaceIds.has(raceId) || RaceEvents.isRace(raceId)) return true;
      const match = /^hoka-race-(\d{8})-\d{4}$/.exec(raceId);
      if (!match) return false;
      const today = new Date();
      const todayId = `${today.getFullYear()}${String(today.getMonth() + 1).padStart(2, "0")}${String(today.getDate()).padStart(2, "0")}`;
      return match[1] >= todayId;
    }

    function managedRaces(races = []) {
      const order = new Map(demoRaceSessions.map((race, index) => [race.raceId, index]));
      return races
        .filter((race) => race.raceId && !race.isTemplate && isManagedRaceId(race.raceId))
        .sort((left, right) => {
          const leftOrder = order.get(left.raceId) ?? demoRaceSessions.length;
          const rightOrder = order.get(right.raceId) ?? demoRaceSessions.length;
          return leftOrder - rightOrder || right.raceId.localeCompare(left.raceId);
        });
    }

    function mergeRaceCatalog(races = []) {
      const merged = new Map((races || []).map((race) => [race.raceId, race]));
      if (!merged.has(SrcOct11.raceId)) merged.set(SrcOct11.raceId, {raceId: SrcOct11.raceId, name: SrcOct11.name, stationCount: 8, checkpoints: SrcOct11.checkpoints, mode: "station_checkpoints", checkpointLayout: "station_boundaries"});
      nanxiRaceCatalog.forEach((race) => {
        if (!merged.has(race.raceId)) merged.set(race.raceId, { ...race, mode: "station_checkpoints", checkpointLayout: "station_boundaries" });
      });
      return managedRaces(Array.from(merged.values()));
    }

    function updateAuthRoleOptions() {
      const current = elements.authUsername.value;
      const race = authRaceCatalog.get(elements.authRaceId.value);
      const stationCount = Math.max(0, Number(race?.stationCount || 0));
      const options = judgeRoleOptions.filter((option) => {
        if (option.role === "admin" || option.role === "start") return true;
        const stationNumber = Number(option.role.replace("station_", ""));
        return stationNumber <= stationCount;
      });
      elements.authUsername.replaceChildren(...options.map((option) => new Option(SrcOct11.isRace(elements.authRaceId.value) && option.role.startsWith("station_") ? `${option.label} · ${SrcOct11.stations[Number(option.role.split("_")[1])-1]}` : option.label, option.role)));
      elements.authUsername.value = options.some((option) => option.role === current)
        ? current
        : options.find((option) => option.role === "admin")?.role || options[0]?.role || "";
      syncResponsiveSelect(elements.authUsername);
    }

    function setMessage(message, tone = "info") {
      elements.messageText.textContent = message;
      elements.message.dataset.tone = tone;
      elements.messageAction.hidden = true;
      pendingRollbackParticipantId = null;
    }

    function setRollbackMessage(message, participantId) {
      elements.messageText.textContent = message;
      elements.message.dataset.tone = "success";
      elements.messageAction.hidden = false;
      pendingRollbackParticipantId = participantId;

    function setConnection(text, tone) {
      elements.connectionText.textContent = text;
      elements.connection.dataset.tone = tone;
    }

    function judgeNfcUnavailableReason() {
      if (window.self !== window.top) return "当前页面被嵌入，无法扫描 NFC。请直接打开裁判台页面。";
      if (!window.isSecureContext) return "NFC 需要 HTTPS 安全页面。";
      if (!("NDEFReader" in window)) return "当前浏览器不支持 Web NFC，请使用安卓 Chrome；iPhone 可继续使用列表中的人工确认。";
      return "";
    }

    function decodeJudgeNfcRecord(record) {
      if (!record?.data) return "";
      try {
        return new TextDecoder(record.encoding || "utf-8").decode(record.data).trim();
      } catch (error) {
        return "";
      }
    }

    function readJudgeNfcCardCode(message) {
      for (const record of message.records || []) {
        if (record.recordType !== "text") continue;
        const value = decodeJudgeNfcRecord(record).toUpperCase();
        if (value) return value;
      }
      return "";
    }

    function nfcEntryMatches(entry, value) {
      let memberBibs = entry.memberBibNumbers || entry.member_bib_numbers || [];
      if (typeof memberBibs === "string") {
        try { memberBibs = JSON.parse(memberBibs); } catch (error) { memberBibs = [memberBibs]; }
      }
      if (!Array.isArray(memberBibs)) memberBibs = [memberBibs];
      return [entry.cardCode, entry.card_code, entry.bibNumber, entry.bib_number, ...memberBibs]
        .some((candidate) => String(candidate || "").trim().toUpperCase() === value);
    }

    function entryIdentityText(entry, { includeCard = false } = {}) {
      const roster = Nanxi.rosterText(entry);
      return [
        entry.athleteName,
        !roster && entry.bibNumber ? `号码牌：${entry.bibNumber}` : "",
        roster ? `全队号码牌：${roster}` : "",
        includeCard && entry.cardCode ? `手环：${entry.cardCode}` : ""
      ].filter(Boolean).join(" · ");
    }

    function judgeNfcMode() {
      const scope = currentJudgeScope();
      if (isStationJudge() && allowedJudgeCheckpoints().length) return "checkpoint";
      if (scope === "start") return "checkin";
      return "locate";
    }

    function updateJudgeNfcControl({ resetStatus = true } = {}) {
      const mode = judgeNfcMode();
      if (mode === "checkpoint") {
        const checkpoint = allowedJudgeCheckpoints()[0];
        elements.judgeNfcButton.textContent = judgeNfcReader || judgeNfcStarting
          ? "停止本站 NFC"
          : "启动本站 NFC 打卡";
        if (resetStatus) elements.judgeNfcStatus.textContent = judgeNfcReader || judgeNfcStarting
          ? `贴卡后直接确认${checkpointLabel(checkpoint)}`
          : `贴卡后直接确认${checkpointLabel(checkpoint)}，人工按钮仍可使用`;
      } else if (mode === "checkin") {
        elements.judgeNfcButton.textContent = judgeNfcReader || judgeNfcStarting
          ? "停止起点 NFC"
          : "启动起点 NFC 核验";
        if (resetStatus) elements.judgeNfcStatus.textContent = judgeNfcReader || judgeNfcStarting
          ? "贴卡后写入待发队列，发枪后才开始计时"
          : "贴卡后写入待发队列，人工核验仍可使用";
      } else {
        elements.judgeNfcButton.textContent = judgeNfcReader || judgeNfcStarting
          ? "停止 NFC 定位"
          : "启动 NFC 定位";
        if (resetStatus) elements.judgeNfcStatus.textContent = "刷卡后自动定位队伍";
      }
    }

    function focusEntryFromNfc(cardCode, { message = true } = {}) {
      const entry = entries.find((candidate) => nfcEntryMatches(candidate, cardCode));
      if (!entry) {
        setMessage(`NFC ${cardCode} 未在当前比赛中找到，请检查比赛日期或报名信息。`, "error");
        elements.judgeNfcStatus.textContent = `未找到 ${cardCode}`;
        elements.judgeNfcStatus.dataset.tone = "error";
        return;
      }
      nfcFocusedParticipantId = entry.participantId;
      elements.searchInput.value = "";
      activeCategory = "all";
      updateNanxiCategoryTabs();
      if (isStationJudge()) {
        activeFilter = "racing";
      } else if (currentJudgeScope() === "start") {
        activeFilter = resolvedStatus(entry) === "ready" ? "ready" : "not_ready";
      } else {
        const targetFilter = resolvedStatus(entry);
        activeFilter = ["ready", "racing", "finished", "not_ready", "dnf"].includes(targetFilter)
          ? targetFilter
          : "racing";
      }
      applyJudgeRoleView();
      renderEntries();
      updateDock();
      const row = elements.entryList.querySelector(`[data-participant-id="${CSS.escape(String(entry.participantId))}"]`);
      row?.scrollIntoView({ behavior: "smooth", block: "center" });
      const nextCheckpoint = confirmableCheckpointForEntry(entry);
      const actionHint = nextCheckpoint
        ? `，请点击“${checkpointActionLabel(nextCheckpoint)}”确认`
        : "，请查看当前状态";
      elements.judgeNfcStatus.textContent = `${cardCode} · 已定位`;
      elements.judgeNfcStatus.dataset.tone = "success";
      if (message) setMessage(`${entryIdentityText(entry)} · ${statusDetail(entry)}${actionHint}`, "success");
      return entry;
    }

    async function confirmJudgeNfcCard(cardCode) {
      const entry = focusEntryFromNfc(cardCode, { message: false });
      if (!entry) return;
      const mode = judgeNfcMode();
      const eventTime = new Date().toISOString();
      const checkpoint = mode === "checkpoint" ? confirmableCheckpointForEntry(entry) : null;
      if (mode === "checkpoint" && !checkpoint) {
        setMessage(`${entryIdentityText(entry)} 当前没有可确认的本站进度，请刷新后重试。`, "error");
        elements.judgeNfcStatus.textContent = `${cardCode} · 无需确认`;
        elements.judgeNfcStatus.dataset.tone = "error";
        return;
      }
      if (mode === "locate") {
        focusEntryFromNfc(cardCode);
        return;
      }
      elements.judgeNfcStatus.textContent = `${cardCode} · 正在保存…`;
      elements.judgeNfcStatus.dataset.tone = "success";
      try {
        let response;
        if (isDemoMode) {
          applyDemoOperation(mode === "checkin" ? "checkin" : "checkpoint", entry,
            mode === "checkpoint" ? { stationId: checkpoint, eventTime } : {});
          response = { ok: true, status: mode === "checkin" ? "start_ready" : "accepted" };
        } else if (mode === "checkin") {
          response = await readJson(await window.timingApiFetch("/api/start-checkins", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              raceId: elements.raceId.value,
              cardCode: entry.cardCode,
              deviceId,
              judgeToken,
              adminCode: judgeAdminCode,
              source: "judge-nfc-checkin"
            })
          }));
        } else {
          response = await readJson(await window.timingApiFetch("/api/manual-checkpoints", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              raceId: elements.raceId.value,
              participantId: entry.participantId,
              stationId: checkpoint,
              eventTime,
              deviceId,
              judgeToken,
              adminCode: judgeAdminCode,
              reason: "裁判台 NFC 现场确认"
            })
          }));
        }
        if (response.status !== (mode === "checkin" ? "start_ready" : "accepted")) {
          throw new Error(response.error || (mode === "checkin" ? "该手环未绑定待发选手" : "本站已确认或进度已变化，请刷新"));
        }
        await loadData({ silent: true });
        const refreshed = entries.find((candidate) => candidate.participantId === entry.participantId) || entry;
        nfcFocusedParticipantId = refreshed.participantId;
        renderEntries();
        updateCounts();
        updateDock();
        const savedLabel = mode === "checkin" ? "起点核验成功，等待发枪" : `${checkpointLabel(checkpoint)}已记录`;
        elements.judgeNfcStatus.textContent = `${cardCode} · ${savedLabel}`;
        elements.judgeNfcStatus.dataset.tone = "success";
        setMessage(`${entryIdentityText(refreshed)} · ${savedLabel}`, "success");
      } catch (error) {
        elements.judgeNfcStatus.textContent = `${cardCode} · 保存失败`;
        elements.judgeNfcStatus.dataset.tone = "error";
        setMessage(`NFC 打卡未记录：${error.message}`, "error");
      }
    }

    function queueJudgeNfcCard(cardCode) {
      const normalized = String(cardCode || "").trim().toUpperCase();
      if (!normalized) return;
      const mode = judgeNfcMode();
      const checkpoint = mode === "checkpoint" ? (allowedJudgeCheckpoints()[0] || "") : mode;
      const duplicateKey = `${checkpoint}:${normalized}`;
      const now = Date.now();
      const previous = judgeNfcRecentScans.get(duplicateKey) || 0;
      if (now - previous < 2500) {
        elements.judgeNfcStatus.textContent = `${normalized} · 重复刷卡已忽略`;
        elements.judgeNfcStatus.dataset.tone = "error";
        return;
      }
      judgeNfcRecentScans.set(duplicateKey, now);
      judgeNfcSubmitQueue = judgeNfcSubmitQueue
        .then(() => confirmJudgeNfcCard(normalized))
        .catch((error) => setMessage(`NFC 打卡未记录：${error.message}`, "error"));
    }

    async function stopJudgeNfcScan() {
      judgeNfcAbortController?.abort();
      judgeNfcAbortController = null;
      judgeNfcReader = null;
      judgeNfcStarting = false;
      elements.judgeNfcButton.dataset.scanning = "false";
      updateJudgeNfcControl({ resetStatus: !(judgeNfcReader || judgeNfcStarting) });
      elements.judgeNfcStatus.dataset.tone = "";
    }

    async function toggleJudgeNfcScan() {
      if (judgeNfcReader || judgeNfcStarting) {
        await stopJudgeNfcScan();
        setMessage("NFC 定位已停止。", "info");
        return;
      }
      const unavailable = judgeNfcUnavailableReason();
      if (unavailable) {
        elements.judgeNfcStatus.textContent = unavailable;
        elements.judgeNfcStatus.dataset.tone = "error";
        setMessage(unavailable, "error");
        return;
      }
      judgeNfcStarting = true;
      elements.judgeNfcButton.disabled = true;
      try {
        judgeNfcAbortController = new AbortController();
        judgeNfcReader = new NDEFReader();
        const scanStarted = judgeNfcReader.scan({ signal: judgeNfcAbortController.signal });
        judgeNfcReader.addEventListener("reading", (event) => {
          const cardCode = readJudgeNfcCardCode(event.message);
          if (!cardCode) {
            setMessage("读到了 NFC，但没有找到卡号文本。", "error");
            return;
          }
          if (judgeNfcMode() === "locate") focusEntryFromNfc(cardCode);
          else queueJudgeNfcCard(cardCode);
        });
        judgeNfcReader.addEventListener("readingerror", () => {
          setMessage("NFC 读取失败，请将卡片移开后重新贴卡。", "error");
        });
        await scanStarted;
        elements.judgeNfcButton.dataset.scanning = "true";
        updateJudgeNfcControl({ resetStatus: !(judgeNfcReader || judgeNfcStarting) });
        elements.judgeNfcStatus.textContent = judgeNfcMode() === "checkpoint"
          ? `正在等待 NFC 卡 · ${checkpointLabel(allowedJudgeCheckpoints()[0])}`
          : judgeNfcMode() === "checkin"
            ? "正在等待 NFC 卡 · 起点核验"
            : "正在等待 NFC 卡…";
        elements.judgeNfcStatus.dataset.tone = "success";
        const mode = judgeNfcMode();
        setMessage(
          mode === "checkpoint"
            ? `本站 NFC 已启动，贴卡后直接确认${checkpointLabel(allowedJudgeCheckpoints()[0])}。`
            : mode === "checkin"
              ? "起点 NFC 已启动，贴卡后写入待发核验。"
              : "NFC 定位已启动，刷卡后会自动定位队伍。",
          "success",
        );
      } catch (error) {
        await stopJudgeNfcScan();
        const detail = error.name === "NotAllowedError"
          ? "NFC 权限未允许，请在安卓 Chrome 的网站权限中允许 NFC。"
          : error.message;
        elements.judgeNfcStatus.textContent = detail;
        elements.judgeNfcStatus.dataset.tone = "error";
        setMessage(`无法启动 NFC 定位：${detail}`, "error");
      } finally {
        judgeNfcStarting = false;
        elements.judgeNfcButton.disabled = false;
      }
    }

    function configureDemoMode() {
      if (!isDemoMode) return;
      document.title = "HOKA 裁判台体验模式";
      elements.authBackdrop.hidden = true;
      elements.judgeApp.inert = false;
      document.body.classList.remove("auth-pending");
      elements.demoBadge.hidden = false;
      elements.demoLink.href = "./judge.html";
      elements.demoLink.textContent = "返回正式裁判台";
      elements.refreshButton.textContent = "重置体验";
      [elements.bindingLink, elements.nfcLink].forEach((link) => {
        link.setAttribute("aria-disabled", "true");
        link.tabIndex = -1;
      });
    }

    async function readJson(response) {
      const text = await response.text();
      let payload;
      try { payload = text ? JSON.parse(text) : {}; }
      catch { throw new Error(`服务器返回格式错误（HTTP ${response.status}）`); }
      if (!response.ok || !payload.ok) throw new Error(payload.error || `HTTP ${response.status}`);
      return payload;
    }

    function formatClock(value) {
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? "--:--:--" : date.toLocaleTimeString([], { hour12: false });
    }

    function formatDuration(milliseconds) {
      if (milliseconds === null || milliseconds === undefined || !Number.isFinite(Number(milliseconds))) return "--:--:--";
      const totalSeconds = Math.max(0, Math.floor(Number(milliseconds) / 1000));
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      return `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
    }

    function toDateTimeLocal(value) {
      const date = value ? new Date(value) : new Date();
      const local = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
      return local.toISOString().slice(0, 23);
    }

    function resolvedStatus(entry) {
      if (entry.status === "ready") return "ready";
      if (entry.status === "not_ready") return "not_ready";
      return entry.result?.status || "racing";
    }

    function filterStatus(entry) {
      const status = resolvedStatus(entry);
      if (status === "paused") return "racing";
      return status;
    }

    function statusLabel(entry) {
      return {
        ready: "待发",
        not_ready: "未核验",
        racing: "进行中",
        paused: "已暂停",
        finished: "已完赛",
        dnf: "已退赛",
        dns: "未出发"
      }[resolvedStatus(entry)] || "进行中";
    }

    function statusDetail(entry) {
      const status = resolvedStatus(entry);
      if (status === "ready") return `核验 ${formatClock(entry.confirmedAt)}`;
      if (status === "not_ready") return "等待 NFC 或人工核验";
      if (entry.result?.elapsedMs !== null && entry.result?.elapsedMs !== undefined) {
        const checkpoint = entry.result.latestCheckpoint || "START";
        return `${formatDuration(entry.result.elapsedMs)} · ${checkpoint === "START" ? "起点" : checkpointLabel(checkpoint)}`;
      }
      return entry.startedAt ? `开始 ${formatClock(entry.startedAt)}` : "已开始";
    }

    function visibleEntries() {
      const query = elements.searchInput.value.trim().toLowerCase();
      return entries.filter((entry) => {
        const categoryCode = Nanxi.categoryForRow(entry) || String(entry.bibNumber || "").charAt(0).toUpperCase();
        if (RaceEvents.isRace(elements.raceId.value) && activeCategory !== "all" && categoryCode !== activeCategory) return false;
        if (SrcOct11.isRace(elements.raceId.value) && activeCategory === "G" && oct11Wave !== "all" && Number(entry.startBatch) !== Number(oct11Wave)) return false;
        if (filterStatus(entry) !== activeFilter) return false;
        if (isStationJudge() && !confirmableCheckpointForEntry(entry)) return false;
        if (!query) return true;
        const haystack = [entry.bibNumber, ...Nanxi.memberBibNumbers(entry), entry.athleteName, entry.cardCode, ...(entry.memberNames || [])].join(" ").toLowerCase();
        return haystack.includes(query);
      });
    }

    function selectedEntries() {
      return entries.filter((entry) => selectedIds.has(entry.participantId));
    }

    function isAdminJudge() {
      return judgeRole === "admin";
    }

    function currentJudgeScope() {
      return isAdminJudge() ? activeJudgeScope : judgeRole;
    }

    function isStationJudge() {
      return String(currentJudgeScope()).startsWith("station_");
    }

    function roleLabel(role) {
      const label = judgeRoleOptions.find((option) => option.role === role)?.label || role;
      if (SrcOct11.isRace(elements.raceId.value) && role.startsWith('station_')) return `${label} · ${SrcOct11.stations[Number(role.split('_')[1])-1]}${role === 'station_8' ? ' / 完赛' : ''}`;
      return role === `station_${activeRace?.stationCount || 5}` ? `${label} / 冲线` : label;
    }

    function roleDescription(role) {
      if (role === "admin") return "可查看全部队伍、确认任意下一站，并撤回最近一次站点确认。";
      if (role === "start") return "负责待发队伍的批量发枪和起点人工确认。";
      if (role === `station_${activeRace?.stationCount || 5}`) return "仅显示下一步为最后一站结束的参赛单位；确认后记录冲线时间。";
      const stationNumber = String(role).replace("station_", "");
      return `仅显示下一步为站点 ${stationNumber} 结束的队伍，避免误触其他站点。`;
    }

    function checkpointsForRole(role) {
      if (role === "admin") return [];
      const checkpoints = activeRace?.checkpoints || demoRace.checkpoints;
      if (!isDemoMode && role === judgeRole && judgeAllowedCheckpoints.length) {
        return judgeAllowedCheckpoints.filter((checkpoint) => checkpoints.includes(checkpoint));
      }
      if (role === "start") return checkpoints.includes("START") ? ["START"] : [];
      const stationNumber = Number(String(role).replace("station_", ""));
      if (!Number.isInteger(stationNumber) || stationNumber < 1 || stationNumber > Number(activeRace?.stationCount || demoRace.stationCount)) return [];
      if (checkpoints.includes("STATION_1_START")) {
        const allowed = [];
        const directCheckpoint = `STATION_${stationNumber}_START`;
        if (checkpoints.includes(directCheckpoint)) allowed.push(directCheckpoint);
        if (stationNumber >= Number(activeRace?.stationCount || demoRace.stationCount) && checkpoints.includes("END")) {
          allowed.push("END");
        }
        return allowed;
      }
      const boundaryCheckpoint = stationNumber >= Number(activeRace?.stationCount || demoRace.stationCount)
        ? "END"
        : `STATION_${stationNumber + 1}_START`;
      return checkpoints.includes(boundaryCheckpoint) ? [boundaryCheckpoint] : [];
    }

    function canStartTeams() {
      return ["admin", "start"].includes(currentJudgeScope());
    }

    function allowedJudgeCheckpoints() {
      return checkpointsForRole(currentJudgeScope());
    }

    function canConfirmCheckpoint(checkpoint = null) {
      if (isAdminJudge() && currentJudgeScope() === "admin") return true;
      const allowed = allowedJudgeCheckpoints();
      return checkpoint ? allowed.includes(checkpoint) : allowed.length > 0;
    }

    function nextCheckpointForEntry(entry) {
      if (entry.result?.status === "finished" || entry.result?.latestCheckpoint === "END") return null;
      const checkpoints = Array.isArray(activeRace?.checkpoints) ? activeRace.checkpoints : demoRace.checkpoints;
      const latestCheckpoint = entry.result?.latestCheckpoint || null;
      if (!latestCheckpoint) return checkpoints[0] || null;
      const latestIndex = checkpoints.indexOf(latestCheckpoint);
      if (latestIndex < 0 || latestIndex + 1 >= checkpoints.length) return null;
      return checkpoints[latestIndex + 1];
    }

    function confirmableCheckpointForEntry(entry) {
      if (["dnf", "paused", "dns"].includes(entry.result?.status)) return null;
      const checkpoint = nextCheckpointForEntry(entry);
      return checkpoint && canConfirmCheckpoint(checkpoint) ? checkpoint : null;
    }

    function checkpointRecordsFinish(checkpoint) {
      const checkpoints = Array.isArray(activeRace?.checkpoints) ? activeRace.checkpoints : demoRace.checkpoints;
      const stationCount = Number(activeRace?.stationCount || demoRace.stationCount);
      const finalStation = `STATION_${stationCount}_START`;
      const finalStationIndex = checkpoints.indexOf(finalStation);
      return checkpoint === finalStation
        && finalStationIndex >= 0
        && checkpoints[finalStationIndex + 1] === "END"
        && (activeRace?.checkpointLayout === "station_starts" || checkpoints.includes("STATION_1_START"));
    }

    function checkpointActionLabel(checkpoint) {
      if (checkpoint === "END") {
        if (activeRace?.checkpointLayout === "station_boundaries") {
          return `确认站点 ${Number(activeRace.stationCount || demoRace.stationCount)} 结束 / 冲线`;
        }
        return "确认冲线";
      }
      if (checkpointRecordsFinish(checkpoint)) return "确认冲线";
      const label = checkpointLabel(checkpoint);
      return `确认${label.replace(/\s确认$/, "")}`;
    }

      const card = document.createElement("div");

      const status = document.createElement("div");
      status.className = "status-cell";

      pill.className = `state ${resolvedStatus(entry)}`;
      pill.textContent = statusLabel(entry);

      const actions = document.createElement("div");
      actions.className = "row-actions";

      const confirmableCheckpoint = confirmableCheckpointForEntry(entry);
      if (currentStatus === "ready") {
        if (canStartTeams()) actions.append(actionButton("取消核验", "cancel-checkin", entry));
      } else if (["racing", "paused"].includes(currentStatus)) {
        if (confirmableCheckpoint) {
          actions.append(actionButton(checkpointActionLabel(confirmableCheckpoint), "checkpoint", entry, "primary"));
        }
        if (isAdminJudge()) {
          if (entry.result?.latestCheckpoint) actions.append(actionButton("撤回上一步", "rollback", entry));
          actions.append(actionButton("手动时间", "manual", entry));
          actions.append(actionButton("确认退赛", "dnf", entry, "danger"));

      } else if (currentStatus === "finished") {

          if (entry.result?.latestCheckpoint) actions.append(actionButton("撤回冲线", "rollback", entry, "danger"));
          actions.append(actionButton("加减时间", "adjustment", entry, "primary"));
          actions.append(actionButton("手动时间", "manual", entry));
        }
      } else if (currentStatus === "dnf") {

      } else if (currentStatus === "not_ready") {
        if (canStartTeams()) {
          actions.append(actionButton("人工核验待发", "checkin", entry, "primary"));
        }
        if (isAdminJudge()) {
          actions.append(actionButton("手动时间", "manual", entry));
          actions.append(actionButton("确认退赛", "dnf", entry, "danger"));
        }
      }

      row.append(checkWrap, main, card, status, actions);
      return row;
    }

    function applyDemoOperation(mode, entry, details = {}) {
      entry.demoNotes = [...(entry.demoNotes || []), {
        mode,
        reason: details.reason || "",
        createdAt: new Date().toISOString()
      }];
      if (mode === "adjustment") {
        entry.result.elapsedMs = Math.max(0, Number(entry.result.elapsedMs || 0) + details.adjustmentMs);
        return;
      }
      if (mode === "manual") {
        entry.status = "started";
        entry.startedAt = details.startTime;
        entry.result = {
          status: "finished",
          elapsedMs: Math.max(0, new Date(details.finishTime).getTime() - new Date(details.startTime).getTime()),
          latestCheckpoint: "END",
          startTime: details.startTime,
          finishTime: details.finishTime
        };
        return;
      }
      if (mode === "checkpoint") {
        const confirmedStationIds = checkpointRecordsFinish(details.stationId)
          ? [details.stationId, "END"]
          : [details.stationId];
        entry.result = entry.result || {
          status: "racing",
          elapsedMs: 0,
          latestCheckpoint: "START",
          startTime: entry.startedAt || null,
          finishTime: null
        };
        entry.result.checkpointTimes = {
          ...(entry.result.checkpointTimes || {}),
          ...Object.fromEntries(confirmedStationIds.map((stationId) => [stationId, details.eventTime]))
        };
        const checkpoints = Array.isArray(activeRace?.checkpoints) ? activeRace.checkpoints : demoRace.checkpoints;
        const currentIndex = checkpoints.indexOf(entry.result.latestCheckpoint);
        const latestConfirmedStation = confirmedStationIds[confirmedStationIds.length - 1];
        const stationIndex = checkpoints.indexOf(latestConfirmedStation);
        if (stationIndex > currentIndex) entry.result.latestCheckpoint = details.stationId;
        if (confirmedStationIds.includes("END")) {
          entry.result.latestCheckpoint = "END";
          entry.status = "started";
          entry.result.status = "finished";
          entry.result.finishTime = details.eventTime;
          entry.result.elapsedMs = entry.result.startTime
            ? Math.max(0, new Date(details.eventTime).getTime() - new Date(entry.result.startTime).getTime())
            : entry.result.elapsedMs;
        }
        return;
      }
      if (mode === "rollback") {
        const checkpoints = Array.isArray(activeRace?.checkpoints) ? activeRace.checkpoints : demoRace.checkpoints;
        const latestCheckpoint = entry.result?.latestCheckpoint || null;
        let previousIndex = checkpoints.indexOf(latestCheckpoint) - 1;
        const finalStation = `STATION_${Number(activeRace?.stationCount || demoRace.stationCount)}_START`;
        if (latestCheckpoint === "END" && checkpointRecordsFinish(finalStation)) {
          if (entry.result?.checkpointTimes) delete entry.result.checkpointTimes[finalStation];
          previousIndex -= 1;
        }
        if (entry.result?.checkpointTimes && latestCheckpoint) delete entry.result.checkpointTimes[latestCheckpoint];
        const previousCheckpoint = previousIndex >= 0 ? checkpoints[previousIndex] : null;
        if (!previousCheckpoint) {
          entry.status = "ready";
          entry.startedAt = null;
          entry.result = null;
          return;
        }
        entry.status = "started";
        entry.result.status = "racing";
        entry.result.latestCheckpoint = previousCheckpoint;
        entry.result.finishTime = null;
        entry.result.elapsedMs = entry.result.startTime
          ? Math.max(0, Date.now() - new Date(entry.result.startTime).getTime())
          : entry.result.elapsedMs;
        return;
      }
      if (mode === "checkin") {
        entry.status = "ready";
        entry.confirmedAt = new Date().toISOString();
        return;
      }
      if (mode === "cancel-checkin") {
        entry.status = "not_ready";
        entry.confirmedAt = null;
        entry.result = null;
        return;
      }
      if (mode === "dnf") {
        entry.demoPreviousState = {
          status: entry.status,
          confirmedAt: entry.confirmedAt,
          startedAt: entry.startedAt,
          result: entry.result ? JSON.parse(JSON.stringify(entry.result)) : null
        };
        entry.status = "started";
        entry.result = {
          ...(entry.result || {}),
          status: "dnf",
          elapsedMs: entry.result?.elapsedMs ?? null,
          latestCheckpoint: entry.result?.latestCheckpoint || null,
          startTime: entry.result?.startTime || entry.startedAt || null,
          finishTime: null
        };
        return;
      }
      if (mode === "restore") {
        const previous = entry.demoPreviousState;
        if (previous) {
          entry.status = previous.status;
          entry.confirmedAt = previous.confirmedAt;
          entry.startedAt = previous.startedAt;
          entry.result = previous.result;
        } else {
          entry.status = "started";
          entry.result = { ...entry.result, status: "racing", finishTime: null };
        }
        entry.demoPreviousState = null;
      }
    }
