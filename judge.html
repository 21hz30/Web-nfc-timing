    async function loadData({ silent = false } = {}) {
      if (!elements.raceId.value || refreshInFlight) return;
      if (isDemoMode) {
        updateDemoElapsedTimes();
        activeRace = demoRace;
        entries = demoEntries;
        elements.raceName.textContent = `${demoRace.name} · ${entries.length} 支队伍`;
        updateCounts();
        renderEntries();
        updateDock();
        setConnection("体验中", "live");
        if (!silent) setMessage("体验数据已载入，所有操作只保存在当前页面。", "success");
        return;
      }
      refreshInFlight = true;
      if (!silent) setConnection("更新中", "idle");
      try {
        const raceId = encodeURIComponent(elements.raceId.value);
        const [queuePayload, leaderboardPayload] = await Promise.all([
          readJson(await window.timingApiFetch(`/api/start-queue?raceId=${raceId}`)),
          readJson(await window.timingApiFetch(`/api/leaderboard?raceId=${raceId}`))
        ]);
        const results = new Map((leaderboardPayload.leaderboard || []).map((result) => [Number(result.participantId), result]));
        activeRace = queuePayload.race;
        updateRoleControls();
        updateNanxiCategoryTabs();
        updateBranding();
        updateBatchScopeText();
        updateNfcLink();
        updateJudgeNfcControl({ resetStatus: !(judgeNfcReader || judgeNfcStarting) });
        entries = (queuePayload.entries || []).map((entry) => ({ ...entry, result: results.get(Number(entry.participantId)) || null }));
        const entryUnit = RaceEvents.isRace(activeRace.raceId) ? "个参赛单位" : activeRace.entryType === "team" ? "支队伍" : "人";
        elements.raceName.textContent = `${raceDisplayName({ raceId: activeRace.raceId || elements.raceId.value, name: activeRace.name })} · ${entries.length} ${entryUnit}`;
        updateCounts();
        renderEntries();
        updateDock();
        setConnection(`已更新 ${formatClock(queuePayload.generatedAt)}`, "live");
        if (!silent) setMessage(`队列已更新，${queuePayload.summary?.ready || 0} ${entryUnit}等待发枪。`, "success");
      } catch (error) {
        setConnection("连接失败", "error");
        setMessage(`读取失败：${error.message}`, "error");
      } finally {
        refreshInFlight = false;
      }
    }

    function openModal(backdrop) {
      backdrop.hidden = false;
      document.body.classList.add("modal-open");
    }

    function closeModals() {
      elements.startBackdrop.hidden = true;
      elements.operationBackdrop.hidden = true;
      document.body.classList.remove("modal-open");
      elements.startError.textContent = "";
      elements.operationError.textContent = "";
      elements.confirmStartButton.disabled = false;
      elements.confirmOperationButton.disabled = false;
      operationEntry = null;
      operationMode = "";
    }

    function checkpointLabel(checkpoint) {
      if (SrcOct11.isRace(elements.raceId.value)) return SrcOct11.checkpointLabel(checkpoint);
      if (checkpoint === "START") return "起点核验 / 等待发枪";
      if (checkpoint === "END") return "终点";
      const match = String(checkpoint).match(/^STATION_(\d+)_(ENTER|EXIT|START)$/);
      if (!match) return checkpoint;
      if (activeRace?.checkpointLayout === "station_boundaries" && match[2] === "START") {
        return `站点 ${Number(match[1]) - 1} 结束`;
      }
      const typeLabel = { ENTER: "进站", EXIT: "出站", START: "确认" }[match[2]] || match[2];
      return `站点 ${match[1]} ${typeLabel}`;
    }

    function manualCheckpointOptions(entry) {
      const checkpoint = confirmableCheckpointForEntry(entry);
      if (!checkpoint) return [];
      const label = checkpointRecordsFinish(checkpoint)
        ? `${checkpointLabel(checkpoint).replace(/\s确认$/, "")}（终点）`
        : checkpointLabel(checkpoint);
      return [{ checkpoint, label, disabled: false }];
    }

    function openStartModal() {
      const selected = selectedEntries();
      if (!selected.length) return;
      if (SrcOct11.isRace(elements.raceId.value)) {
        const categories = new Set(selected.map(Nanxi.categoryForRow));
        if (categories.has('G') && (selected.length > 4 || new Set(selected.map(row => row.startBatch).filter(value => value != null)).size > 1)) { setMessage("四人接力每轮最多 4 队，请选择同一轮的队伍。", "error"); return; }
      }
      elements.startModalTitle.textContent = "确认发枪";
      elements.startDescription.textContent = isDemoMode
        ? "确认后，所选参赛单位会立即使用同一个模拟开始时间。"
        : "确认后，所选参赛单位会立即写入同一个开始时间。";
      elements.startParticipants.textContent = selected
        .map((entry) => entryIdentityText(entry, { includeCard: true }))
        .join("\n\n");
      openModal(elements.startBackdrop);
      elements.confirmStartButton.focus();
    }

    function openOperation(mode, entry) {
      const checkpointOptions = mode === "checkpoint" ? manualCheckpointOptions(entry) : [];
      const isFinishConfirmation = mode === "checkpoint"
        && (checkpointOptions[0]?.checkpoint === "END" || checkpointRecordsFinish(checkpointOptions[0]?.checkpoint));
      if (mode === "checkpoint" && !checkpointOptions.length) {
        setMessage("该队伍当前没有可人工确认的下一站，请刷新后重试。", "error");
        return;
      }
      operationMode = mode;
      operationEntry = entry;
      elements.operationForm.reset();
      elements.adjustmentFields.hidden = mode !== "adjustment";
      elements.manualFields.hidden = mode !== "manual";
      elements.checkpointFields.hidden = mode !== "checkpoint";
      elements.operationReasonField.hidden = ["checkpoint", "rollback", "checkin"].includes(mode);
      elements.operationReason.required = !["checkpoint", "rollback", "checkin"].includes(mode);
      elements.operationParticipant.textContent = entryIdentityText(entry, { includeCard: true });
      const config = {
        adjustment: ["加减最终时间", "对已完成成绩增加罚时或减少时间。", "保存调整", "primary", "例如：动作判罚或现场复核"],
        manual: ["手动调整时间", "输入完整的开始时间和结束时间，原始刷卡记录不会被修改。", "保存手动时间", "primary", "例如：设备故障，依据备用计时记录"],
        checkpoint: ["人工确认站点", "系统已按队伍当前进度锁定下一站。请核对队伍和确认时间。", "确认本站到达", "primary", ""],
        checkin: ["人工核验待发", "核对选手及手环号码后进入待发队列；裁判统一发枪后才开始计时。", "确认待发", "primary", ""],
        rollback: ["撤回最近确认", "只撤回该队伍最近一次站点确认，原始记录会保留并标记为已撤回。", "确认撤回", "danger", ""],
        dnf: ["确认选手退赛", "确认后选手会立即标记为 DNF。", "确认退赛", "danger", "请填写退赛原因"],
        restore: ["撤销退赛", "选手会恢复到退赛前的计时状态。", "确认恢复", "primary", "请填写恢复原因"],
        "cancel-checkin": ["取消起点核验", "选手会回到未核验状态，不会删除报名或 NFC 绑定。", "确认取消", "danger", "请填写取消原因"]
      }[mode];
      elements.operationTitle.textContent = config[0];
      elements.operationDescription.textContent = config[1];
      elements.confirmOperationButton.textContent = config[2];
      if (mode === "checkpoint" && currentJudgeScope() === "start") {
        elements.operationTitle.textContent = "人工确认起点";
      } else if (isFinishConfirmation) {
        elements.operationTitle.textContent = "人工确认冲线";
        elements.operationDescription.textContent = checkpointOptions[0].checkpoint === "END"
          ? "请核对队伍和冲线时间。"
          : `本次确认会用同一个时间记录${checkpointOptions[0].label.replace("（终点）", "").trim()}、终点，提交后队伍立即完赛。`;
        elements.confirmOperationButton.textContent = "确认冲线";
      } else if (mode === "rollback") {
        const latestCheckpoint = entry.result?.latestCheckpoint || "最近站点";
        elements.operationDescription.textContent = latestCheckpoint === "END"
          ? "将撤回本队刚才的冲线确认，并恢复到上一个有效站点。"
          : `将撤回本队的${checkpointLabel(latestCheckpoint)}确认，并恢复到上一个有效站点。`;
      }
      elements.confirmOperationButton.className = `modal-button ${config[3]}`;
      elements.operationReason.placeholder = config[4];
      if (mode === "manual") {
        if (Nanxi.isRace(elements.raceId.value)) elements.operationDescription.textContent = '录入原始开始与结束时间。系统会在原始用时上自动加罚时、扣除接力减时。';
        elements.manualStartTime.value = toDateTimeLocal(entry.result?.startTime || entry.startedAt);
        elements.manualFinishTime.value = toDateTimeLocal(entry.result?.finishTime || new Date());
      }
      if (mode === "checkpoint") {
        elements.manualCheckpoint.replaceChildren(...checkpointOptions.map((option) => {
          const item = new Option(option.label, option.checkpoint);
          item.disabled = option.disabled;
          return item;
        }));
        elements.manualCheckpoint.disabled = checkpointOptions.length === 1;
        const firstAvailable = [...elements.manualCheckpoint.options].find((option) => !option.disabled);
        if (firstAvailable) elements.manualCheckpoint.value = firstAvailable.value;
        if (isFinishConfirmation) elements.confirmOperationButton.textContent = "确认冲线";
        elements.manualCheckpointTime.value = toDateTimeLocal(new Date());
      } else {
        elements.manualCheckpoint.disabled = false;
      }
      openModal(elements.operationBackdrop);
      (mode === "adjustment"
        ? elements.adjustmentMinutes
        : mode === "manual"
          ? elements.manualStartTime
          : mode === "checkpoint"
            ? elements.manualCheckpointTime
            : ["rollback", "checkin"].includes(mode)
              ? elements.confirmOperationButton
              : elements.operationReason).focus();
    }

    async function confirmStart() {
      const selected = selectedEntries();
      if (!selected.length) return;
      const clickedAt = new Date().toISOString();
      elements.confirmStartButton.disabled = true;
      elements.startError.textContent = isDemoMode ? "正在模拟发枪..." : "正在写入统一开始时间...";
      try {
        if (isDemoMode) {
          const startedAt = clickedAt;
          selected.forEach((entry) => {
            entry.status = "started";
            entry.startedAt = startedAt;
            entry.result = {
              status: "racing",
              elapsedMs: 0,
              latestCheckpoint: "START",
              startTime: startedAt,
              finishTime: null
            };
          });
          const startedCount = selected.length;
          closeModals();
          updateCounts();
          setActiveFilter(currentJudgeScope() === "start" ? "ready" : "racing");
          setMessage(`${startedCount} 个参赛单位已于 ${formatClock(startedAt)} 模拟开始。`, "success");
          return;
        }
        const payload = await readJson(await window.timingApiFetch("/api/start-race", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            raceId: elements.raceId.value,
            participantIds: selected.map((entry) => entry.participantId),
            deviceId,
            judgeToken,
            adminCode: judgeAdminCode,
            startedAt: clickedAt
          })
        }));
        selectedIds.clear();
        closeModals();
        await loadData({ silent: true });
        setMessage(`${payload.startedCount} 个参赛单位已于 ${formatClock(payload.startedAt)} 开始。`, "success");
      } catch (error) {
        elements.startError.textContent = error.message;
        elements.confirmStartButton.disabled = false;
      }
    }

    async function submitOperation(event) {
      event.preventDefault();
      if (!operationEntry) return;
      elements.confirmOperationButton.disabled = true;
      elements.operationError.textContent = "正在保存...";
      try {
        const base = {
          raceId: elements.raceId.value,
          participantId: operationEntry.participantId,
          reason: elements.operationReason.value.trim(),
          judgeToken,
          adminCode: judgeAdminCode
        };
        if (!["checkpoint", "rollback", "checkin"].includes(operationMode) && !base.reason) throw new Error("请填写备注。 ");
        if (operationMode === "checkin") {
          if (isDemoMode) {
            applyDemoOperation(operationMode, operationEntry, {});
          } else {
            const response = await readJson(await window.timingApiFetch("/api/start-checkins", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ ...base, cardCode: operationEntry.cardCode, deviceId })
            }));
            if (response.status !== "start_ready") throw new Error("该选手已发枪或手环绑定已变化，请刷新队列后重试。");
          }
        } else if (operationMode === "adjustment") {
          const seconds = (Number(elements.adjustmentMinutes.value) || 0) * 60 + (Number(elements.adjustmentSeconds.value) || 0);
          if (seconds <= 0) throw new Error("调整时间必须大于 0 秒。 ");
          const adjustmentSeconds = seconds * Number(elements.adjustmentDirection.value);
          if (isDemoMode) {
            applyDemoOperation(operationMode, operationEntry, {
              reason: base.reason,
              adjustmentMs: adjustmentSeconds * 1000
            });
          } else {
            await readJson(await window.timingApiFetch("/api/result-adjustments", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ ...base, adjustmentSeconds })
            }));
          }
        } else if (operationMode === "checkpoint") {
          const stationId = elements.manualCheckpoint.value;
          const expectedCheckpoint = confirmableCheckpointForEntry(operationEntry);
          const eventTimeValue = elements.manualCheckpointTime.value;
          const eventTime = new Date(eventTimeValue);
          if (!stationId) throw new Error("请选择需要确认的站点。 ");
          if (stationId !== expectedCheckpoint) throw new Error("队伍进度已变化，请刷新后确认下一站。 ");
          if (!Number.isFinite(eventTime.getTime())) throw new Error("请输入有效的站点确认时间。 ");
          const eventTimeIso = eventTime.toISOString();
          const details = { reason: base.reason, stationId, eventTime: eventTimeIso };
          if (isDemoMode) {
            applyDemoOperation(operationMode, operationEntry, details);
          } else {
            await readJson(await window.timingApiFetch("/api/manual-checkpoints", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                ...base,
                stationId,
                eventTime: eventTimeIso,
                deviceId
              })
            }));
          }
        } else if (operationMode === "rollback") {
          if (isDemoMode) {
            applyDemoOperation(operationMode, operationEntry, { reason: "管理员撤回误触" });
          } else {
            await readJson(await window.timingApiFetch("/api/rollback-checkpoint", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                ...base,
                reason: "管理员撤回误触"
              })
            }));
          }
        } else if (operationMode === "manual") {
          const start = new Date(elements.manualStartTime.value);
          const finish = new Date(elements.manualFinishTime.value);
          if (!Number.isFinite(start.getTime()) || !Number.isFinite(finish.getTime()) || finish < start) {
            throw new Error("结束时间必须晚于或等于开始时间。 ");
          }
          const startTime = start.toISOString();
          const finishTime = finish.toISOString();
          if (isDemoMode) {
            applyDemoOperation(operationMode, operationEntry, { reason: base.reason, startTime, finishTime });
          } else {
            await readJson(await window.timingApiFetch("/api/manual-results", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ ...base, entryMode: "start_finish", startTime, finishTime })
            }));
          }
        } else if (operationMode === "cancel-checkin") {
          if (isDemoMode) {
            applyDemoOperation(operationMode, operationEntry, { reason: base.reason });
          } else {
            await readJson(await window.timingApiFetch("/api/start-checkins/cancel", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify(base)
            }));
          }
        } else {
          if (isDemoMode) {
            applyDemoOperation(operationMode, operationEntry, { reason: base.reason });
          } else {
            await readJson(await window.timingApiFetch("/api/participant-timing-controls", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ ...base, action: operationMode })
            }));
          }
        }
        const name = operationEntry.athleteName;
        const completedMode = operationMode;
        const completedParticipantId = operationEntry.participantId;
        closeModals();
        await loadData({ silent: true });
        if (completedMode === "checkpoint" && isAdminJudge()) {
          setRollbackMessage(`${name} 的站点确认已保存。`, completedParticipantId);
        } else if (completedMode === "rollback") {
          setMessage(`${name} 已撤回到上一个有效站点。`, "success");
        } else {
          setMessage(`${name} 的裁判操作已保存。`, "success");
        }
      } catch (error) {
        elements.operationError.textContent = error.message;
        elements.confirmOperationButton.disabled = false;
      }
    }

    async function startJudgeConsole() {
      if (judgeConsoleStarted) return;
      judgeConsoleStarted = true;
      try {
        applyJudgeRoleView();
        elements.searchInput.value = "";
        await loadRaces();
        await loadData();
        window.setTimeout(() => {
          if (document.activeElement !== elements.searchInput && elements.searchInput.value) {
            elements.searchInput.value = "";
            renderEntries();
          }
        }, 800);
        pollTimer = window.setInterval(() => {
          if (elements.startBackdrop.hidden && elements.operationBackdrop.hidden && document.visibilityState === "visible") {
            loadData({ silent: true });
          }
        }, 4000);
      } catch (error) {
        judgeConsoleStarted = false;
        setConnection("连接失败", "error");
        setMessage(`启动失败：${error.message}`, "error");
      }
    }

    function showAuthentication(message, { username = judgeUsername || "admin" } = {}) {
      judgeToken = "";
      judgeAdminCode = "";
      judgeConsoleStarted = false;
      window.clearInterval(pollTimer);
      pollTimer = 0;
      closeModals();
      stopJudgeNfcScan();
      elements.authUsername.value = judgeRoleOptions.some((option) => option.role === username)
        ? username
        : "admin";
      syncResponsiveSelect(elements.authUsername);
      elements.authAdminCode.value = "";
      elements.authError.textContent = message;
      elements.authBackdrop.hidden = false;
      elements.judgeApp.inert = true;
      document.body.classList.add("auth-pending");
      setConnection("等待验证", "idle");
      elements.authAdminCode.focus();
    }

    function requireRaceReauthentication(raceId) {
      preferredRaceId = raceId;
      elements.authRaceId.value = raceId;
      syncResponsiveSelect(elements.authRaceId);
      showAuthentication("已切换比赛场次，请重新输入该场次的裁判密码。");
    }

    async function authenticateJudge(event) {
      event.preventDefault();
      const adminCode = elements.authAdminCode.value;
      if (!adminCode) return;
      const username = elements.authUsername.value.trim();
      const raceId = elements.authRaceId.value.trim();
      if (!raceId) {
        elements.authError.textContent = "请选择比赛场次。";
        elements.authRaceId.focus();
        return;
      }
      elements.authSubmitButton.disabled = true;
      elements.authError.textContent = "正在验证...";
      try {
        const authPayload = { raceId, role: username, password: adminCode };
        const auth = await readJson(await window.timingApiFetch("/api/judge-auth", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(authPayload)
        }));
        judgeAdminCode = "";
        judgeToken = auth.judgeToken || "";
        judgeRole = auth.role || "admin";
        judgeDisplayName = auth.displayName || (judgeRole === "admin" ? "管理员" : judgeRole);
        judgeUsername = username;
        activeJudgeScope = judgeRole;
        judgeAllowedCheckpoints = Array.isArray(auth.allowedCheckpoints)
          ? auth.allowedCheckpoints
          : auth.allowedCheckpoint ? [auth.allowedCheckpoint] : [];
        preferredRaceId = raceId || preferredRaceId;
        applyJudgeRoleView();
        elements.authAdminCode.value = "";
        elements.authError.textContent = "";
        elements.authBackdrop.hidden = true;
        elements.judgeApp.inert = false;
        document.body.classList.remove("auth-pending");
        await startJudgeConsole();
      } catch (error) {
        elements.authError.textContent = error.message === "Invalid administrator code"
          ? "密码不正确，请重新输入。"
          : error.message === "Invalid judge account or password"
            ? "裁判岗位或密码不正确。"
          : error.message === "Judge authorization is not configured"
            ? "裁判台密码尚未配置，请联系管理员。"
          : error.message === "Local live preview is read-only"
            ? "当前是线上数据只读预览，无法登录。请使用本地裁判服务或正式线上地址。"
            : `验证失败：${error.message}`;
        elements.authAdminCode.select();
      } finally {
        elements.authSubmitButton.disabled = false;
      }
    }

    document.querySelectorAll(".tab-button").forEach((button) => {
      button.addEventListener("click", () => {
        setActiveFilter(button.dataset.filter);
      });
    });
    document.querySelectorAll("[data-close-modal]").forEach((button) => button.addEventListener("click", closeModals));
    [elements.startBackdrop, elements.operationBackdrop].forEach((backdrop) => {
      backdrop.addEventListener("click", (event) => { if (event.target === backdrop) closeModals(); });
    });
    elements.searchInput.addEventListener("input", renderEntries);
    const unlockSearch = () => { elements.searchInput.readOnly = false; };
    elements.searchInput.addEventListener("pointerdown", unlockSearch, { once: true });
    elements.searchInput.addEventListener("keydown", unlockSearch, { once: true });
    elements.refreshButton.addEventListener("click", () => {
      if (isDemoMode) resetDemoExperience();
      else loadData();
    });
    elements.startRaceButton.addEventListener("click", openStartModal);
    elements.confirmStartButton.addEventListener("click", confirmStart);
    elements.authForm.addEventListener("submit", authenticateJudge);
    elements.judgeNfcButton.addEventListener("click", toggleJudgeNfcScan);
    elements.operationForm.addEventListener("submit", submitOperation);
    elements.roleSelect.addEventListener("change", () => {
      const nextRole = elements.roleSelect.value;
      if (!judgeRoleOptions.some((option) => option.role === nextRole)) return;
      activeJudgeScope = nextRole;
      if (isDemoMode) {
        judgeRole = nextRole;
        judgeDisplayName = nextRole === "admin"
          ? "体验管理员"
          : nextRole === "start"
            ? "体验起点裁判"
            : `体验站点 ${nextRole.replace("station_", "")} 裁判`;
        judgeAllowedCheckpoints = checkpointsForRole(nextRole);
        const url = new URL(location.href);
        url.searchParams.set("role", nextRole);
        history.replaceState({}, "", url);
      }
      selectedIds.clear();
      activeFilter = ["start"].includes(currentJudgeScope()) ? "ready" : "racing";
      applyJudgeRoleView();
      updateCounts();
      renderEntries();
      updateDock();
      setMessage(`已切换到${roleLabel(currentJudgeScope())}。`, "success");
    });
    elements.switchAccountButton.addEventListener("click", () => {
      elements.authRaceId.value = elements.raceId.value;
      syncResponsiveSelect(elements.authRaceId);
      updateAuthRoleOptions();
      showAuthentication("请选择要切换的裁判岗位并输入密码。", { username: judgeUsername || "admin" });
    });
    elements.messageAction.addEventListener("click", () => {
      const entry = entries.find((item) => item.participantId === pendingRollbackParticipantId);
      if (!entry) {
        setMessage("队伍状态已变化，请在全局总控中查找并撤回。", "error");
        return;
      }
      openOperation("rollback", entry);
    });
    elements.raceId.addEventListener("change", async () => {
      if (!isDemoMode && !isAdminJudge()) {
        requireRaceReauthentication(elements.raceId.value);
        return;
      }
      if (isDemoMode) {
        syncDemoRaceFromSelection();
        demoEntries = createDemoEntries();
        entries = demoEntries;
      }
      selectedIds.clear();
      activeFilter = "ready";
      activeCategory = "all";
      applyJudgeRoleView();
      updateBranding();
      updateUrl();
      await loadData();
    });
    elements.authRaceId.addEventListener("change", () => {
      updateAuthRoleOptions();
    });
    document.addEventListener("keydown", (event) => { if (event.key === "Escape") closeModals(); });

    async function start() {
      configureEntryBranding();
      configureDemoMode();
      if (isDemoMode) {
        const requestedRole = String(pageParams.get("role") || "admin").trim().toLowerCase();
        const supportedRoles = judgeRoleOptions.map(option=>option.role);
        judgeRole = supportedRoles.includes(requestedRole) ? requestedRole : "admin";
        activeJudgeScope = judgeRole;
        judgeDisplayName = judgeRole === "admin"
          ? "体验管理员"
          : judgeRole === "start"
            ? "体验起点裁判"
            : `体验站点 ${judgeRole.replace("station_", "")} 裁判`;
        activeRace = demoRace;
        judgeAllowedCheckpoints = checkpointsForRole(judgeRole);
        applyJudgeRoleView();
        startJudgeConsole();
        return;
      }
      setConnection("等待验证", "idle");
      setMessage("请先验证裁判台权限。", "info");
      try {
        await loadAuthRaces();
        const requestedRole = String(pageParams.get("role") || "admin").trim().toLowerCase();
        elements.authUsername.value = Array.from(elements.authUsername.options).some((option) => option.value === requestedRole)
          ? requestedRole
          : "admin";
        syncResponsiveSelect(elements.authUsername);
        elements.authAdminCode.focus();
      } catch (error) {
        elements.authError.textContent = `读取比赛场次失败：${error.message}`;
      }
    }

    window.addEventListener("beforeunload", () => window.clearInterval(pollTimer));
    start();
  </script>
</body>
</html>
