<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HYROX Live Timing</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --bg: #0b0d10;
      --panel: #111418;
      --header: #0f1115;
      --header-border: #252a31;
      --table-head: #171b21;
      --row: #111418;
      --row-alt: #14181e;
      --leader-row: #181c22;
      --text: #f2f4f7;
      --muted: #8d96a0;
      --muted-strong: #c8cdd3;
      --line: #2b3139;
      --input-bg: #12161b;
      --input-border: #343b45;
      --accent: #f2f4f7;
      --time: #f2f4f7;
      --flash: rgba(255, 255, 255, 0.12);
      --flash-border: rgba(255, 255, 255, 0.82);
      --status-bg: transparent;
      --status-text: #c8cdd3;
      --status-border: #343b45;
    }

    body[data-theme="light"] {
      color-scheme: light;
      --bg: #f5f6f8;
      --panel: #ffffff;
      --header: #ffffff;
      --header-border: #d7dee7;
      --table-head: #f0f2f5;
      --row: #ffffff;
      --row-alt: #f8f9fb;
      --leader-row: #f1f3f6;
      --text: #14181f;
      --muted: #66707c;
      --muted-strong: #313842;
      --line: #d9dee5;
      --input-bg: #ffffff;
      --input-border: #c7ced8;
      --accent: #14181f;
      --time: #14181f;
      --flash: rgba(20, 24, 31, 0.08);
      --flash-border: rgba(20, 24, 31, 0.7);
      --status-bg: transparent;
      --status-text: #313842;
      --status-border: #c7ced8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: end;
      padding: 18px 22px;
      border-bottom: 1px solid var(--header-border);
      background: var(--header);
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .sub {
      margin-top: 5px;
      color: var(--muted);
      font-size: 14px;
    }

    .meta {
      display: grid;
      gap: 10px;
      justify-items: end;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .meta-row,
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
    }

    .live {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--accent);
      font-weight: 900;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: none;
    }

    .toggle {
      display: inline-flex;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--panel);
    }

    .toggle button {
      min-width: 56px;
      border: 0;
      border-right: 1px solid var(--line);
      padding: 7px 10px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-weight: 900;
      cursor: pointer;
    }

    .toggle button:last-child {
      border-right: 0;
    }

    .toggle button.active {
      background: var(--text);
      color: var(--bg);
    }

    main {
      width: 100%;
      padding: 14px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(180px, 260px) 1fr;
      gap: 12px;
      align-items: end;
      margin-bottom: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      border: 1px solid var(--input-border);
      border-radius: 6px;
      padding: 10px 11px;
      font: inherit;
      background: var(--input-bg);
      color: var(--text);
    }

    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }

    .metric {
      min-width: 130px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .metric strong {
      display: block;
      margin-top: 2px;
      font-size: 20px;
      line-height: 1.1;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    table {
      width: 100%;
      min-width: 1060px;
      border-collapse: collapse;
    }

    th,
    td {
      border-bottom: 1px solid var(--header-border);
      padding: 9px 10px;
      text-align: left;
      font-size: 13px;
      white-space: nowrap;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--table-head);
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
    }

    tbody tr {
      background: var(--row);
      border-left: 3px solid transparent;
    }

    tbody tr:nth-child(even) {
      background: var(--row-alt);
    }

    tbody tr.leader {
      background: var(--leader-row);
      border-left-color: var(--accent);
    }

    tbody tr.flash {
      animation: rowFlash 1.15s ease-out;
      border-left-color: var(--flash-border);
    }

    @keyframes rowFlash {
      0% {
        background: var(--flash);
        box-shadow: inset 0 0 0 999px var(--flash);
      }
      55% {
        background: var(--flash);
      }
      100% {
        box-shadow: inset 0 0 0 999px transparent;
      }
    }

    .rank {
      width: 52px;
      color: var(--text);
      font-size: 21px;
      font-weight: 950;
      text-align: center;
    }

    .athlete {
      display: grid;
      gap: 2px;
    }

    .athlete strong {
      font-size: 15px;
    }

    .athlete span {
      color: var(--muted);
      font-size: 12px;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .elapsed {
      color: var(--time);
      font-size: 17px;
      font-weight: 950;
    }

    .current {
      color: var(--accent);
      font-weight: 900;
    }

    .status {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--status-border);
      background: var(--status-bg);
      color: var(--status-text);
      font-size: 12px;
      font-weight: 900;
    }

    .status.finished,
    .status.racing,
    .status.not_started {
      background: var(--status-bg);
      color: var(--status-text);
    }

    .split {
      color: var(--muted-strong);
      font-weight: 800;
    }

    .empty {
      padding: 28px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 820px) {
      header,
      .toolbar {
        grid-template-columns: 1fr;
      }

      .meta,
      .meta-row,
      .controls,
      .summary {
        justify-content: flex-start;
        justify-items: start;
      }
    }
  </style>
</head>
<body data-theme="dark">
  <header>
    <div>
      <h1 data-i18n="title">HYROX Live Timing</h1>
      <div class="sub" data-i18n="subtitle">实时排名、进度和每站用时。</div>
    </div>
    <div class="meta">
      <div class="meta-row">
        <span class="live"><span class="dot"></span><span data-i18n="live">LIVE</span></span>
        <span id="updatedAt">-</span>
      </div>
      <div class="controls">
        <div class="toggle" aria-label="Theme">
          <button type="button" id="darkButton" data-theme-button="dark">Dark</button>
          <button type="button" id="lightButton" data-theme-button="light">Light</button>
        </div>
        <div class="toggle" aria-label="Language">
          <button type="button" id="zhButton" data-lang-button="zh">中文</button>
          <button type="button" id="enButton" data-lang-button="en">EN</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <label>
        <span data-i18n="raceId">Race ID</span>
        <input id="raceId" value="hyrox-sim-001" autocomplete="off">
      </label>
      <div class="summary">
        <div class="metric">
          <span data-i18n="total">Total</span>
          <strong id="totalCount">0</strong>
        </div>
        <div class="metric">
          <span data-i18n="racing">Racing</span>
          <strong id="racingCount">0</strong>
        </div>
        <div class="metric">
          <span data-i18n="finished">Finished</span>
          <strong id="finishedCount">0</strong>
        </div>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-i18n="pos">Pos</th>
            <th data-i18n="athlete">Athlete</th>
            <th data-i18n="status">Status</th>
            <th data-i18n="current">Current</th>
            <th data-i18n="elapsed">Elapsed</th>
            <th>S1</th>
            <th>S2</th>
            <th>S3</th>
            <th>S4</th>
            <th>S5</th>
            <th>S6</th>
            <th>S7</th>
            <th>S8</th>
          </tr>
        </thead>
        <tbody id="leaderboardBody">
          <tr><td class="empty" colspan="13">Waiting for timing data...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    const leaderboardBody = document.querySelector("#leaderboardBody");
    const raceIdInput = document.querySelector("#raceId");
    const updatedAt = document.querySelector("#updatedAt");
    const totalCount = document.querySelector("#totalCount");
    const racingCount = document.querySelector("#racingCount");
    const finishedCount = document.querySelector("#finishedCount");
    let language = localStorage.getItem("hyroxLeaderboardLanguage") || "zh";
    let theme = localStorage.getItem("hyroxLeaderboardTheme") || "dark";
    let previousSignatures = null;

    const i18n = {
      zh: {
        title: "HYROX 实时排名",
        subtitle: "实时排名、进度和每站用时。",
        live: "LIVE",
        raceId: "Race ID",
        total: "总人数",
        racing: "比赛中",
        finished: "已完赛",
        pos: "排名",
        athlete: "选手",
        status: "状态",
        current: "当前",
        elapsed: "用时",
        noParticipants: "还没有选手。",
        waitingData: "等待计时数据...",
        bib: "号码",
        error: "错误",
        statusText: {
          finished: "已完赛",
          racing: "比赛中",
          not_started: "未开始"
        },
        currentText: {
          Waiting: "等待",
          Finished: "已完赛"
        },
        run: "跑步",
        station: "站点",
        toEnd: "前往终点"
      },
      en: {
        title: "HYROX Live Timing",
        subtitle: "Live ranking, progress, and station splits.",
        live: "LIVE",
        raceId: "Race ID",
        total: "Total",
        racing: "Racing",
        finished: "Finished",
        pos: "Pos",
        athlete: "Athlete",
        status: "Status",
        current: "Current",
        elapsed: "Elapsed",
        noParticipants: "No participants yet.",
        waitingData: "Waiting for timing data...",
        bib: "Bib",
        error: "Error",
        statusText: {
          finished: "Finished",
          racing: "Racing",
          not_started: "Not Started"
        },
        currentText: {
          Waiting: "Waiting",
          Finished: "Finished"
        },
        run: "Run",
        station: "Station",
        toEnd: "To Finish"
      }
    };

    function t(key) {
      return i18n[language][key] || key;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[character]));
    }

    function applyTheme(nextTheme) {
      theme = nextTheme;
      document.body.dataset.theme = theme;
      localStorage.setItem("hyroxLeaderboardTheme", theme);
      document.querySelectorAll("[data-theme-button]").forEach((button) => {
        button.classList.toggle("active", button.dataset.themeButton === theme);
      });
    }

    function applyLanguage(nextLanguage) {
      language = nextLanguage;
      document.documentElement.lang = language === "zh" ? "zh-CN" : "en";
      localStorage.setItem("hyroxLeaderboardLanguage", language);
      document.querySelectorAll("[data-i18n]").forEach((node) => {
        node.textContent = t(node.dataset.i18n);
      });
      document.querySelectorAll("[data-lang-button]").forEach((button) => {
        button.classList.toggle("active", button.dataset.langButton === language);
      });
    }

    function formatDuration(ms) {
      if (ms === null || ms === undefined) return "-";
      const totalSeconds = Math.floor(ms / 1000);
      const tenths = Math.floor((ms % 1000) / 100);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      if (hours > 0) {
        return `${hours}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}.${tenths}`;
      }
      return `${minutes}:${String(seconds).padStart(2, "0")}.${tenths}`;
    }

    function translateStatus(status) {
      return i18n[language].statusText[status] || status;
    }

    function translateCurrent(current) {
      if (i18n[language].currentText[current]) {
        return i18n[language].currentText[current];
      }

      const runMatch = String(current).match(/^Run (\d+)$/);
      if (runMatch) {
        return `${t("run")} ${runMatch[1]}`;
      }

      const stationMatch = String(current).match(/^Station (\d+)$/);
      if (stationMatch) {
        return `${t("station")} ${stationMatch[1]}`;
      }

      if (current === "To END") {
        return t("toEnd");
      }

      return current || "-";
    }

    function splitCells(splits) {
      let html = "";
      for (let stationNumber = 1; stationNumber <= 8; stationNumber += 1) {
        html += `<td class="split mono">${formatDuration(splits[`station${stationNumber}Ms`])}</td>`;
      }
      return html;
    }

    function rowSignature(row) {
      return JSON.stringify({
        rank: row.rank,
        status: row.status,
        current: row.current,
        latestCheckpoint: row.latestCheckpoint,
        finishTime: row.finishTime,
        splits: row.stationSplits
      });
    }

    function changedRows(rows) {
      const nextSignatures = new Map();
      const changed = new Set();
      for (const row of rows) {
        const key = String(row.participantId);
        const signature = rowSignature(row);
        nextSignatures.set(key, signature);
        if (previousSignatures && previousSignatures.get(key) !== signature) {
          changed.add(key);
        }
      }
      previousSignatures = nextSignatures;
      return changed;
    }

    async function loadLeaderboard() {
      const raceId = raceIdInput.value.trim() || "hyrox-sim-001";
      const response = await fetch(`/api/leaderboard?raceId=${encodeURIComponent(raceId)}`);
      const payload = await response.json();
      if (!response.ok || !payload.ok) {
        throw new Error(payload.error || `HTTP ${response.status}`);
      }

      const rows = payload.leaderboard || [];
      const changed = changedRows(rows);
      totalCount.textContent = rows.length;
      racingCount.textContent = rows.filter((row) => row.status === "racing").length;
      finishedCount.textContent = rows.filter((row) => row.status === "finished").length;
      updatedAt.textContent = new Date(payload.generatedAt).toLocaleTimeString();

      if (rows.length === 0) {
        leaderboardBody.innerHTML = `<tr><td class="empty" colspan="13">${t("noParticipants")}</td></tr>`;
        return;
      }

      leaderboardBody.innerHTML = rows.map((row) => {
        const rowClasses = [
          row.rank === 1 ? "leader" : "",
          changed.has(String(row.participantId)) ? "flash" : ""
        ].filter(Boolean).join(" ");

        return `
          <tr class="${rowClasses}">
            <td class="rank">${row.rank}</td>
            <td>
              <div class="athlete">
                <strong>${escapeHtml(row.athleteName)}</strong>
                <span>${t("bib")} ${escapeHtml(row.bibNumber || "-")} · ${escapeHtml(row.division || "-")}</span>
              </div>
            </td>
            <td><span class="status ${escapeHtml(row.status)}">${escapeHtml(translateStatus(row.status))}</span></td>
            <td class="current">${escapeHtml(translateCurrent(row.current))}</td>
            <td class="elapsed mono">${formatDuration(row.elapsedMs)}</td>
            ${splitCells(row.stationSplits)}
          </tr>
        `;
      }).join("");
    }

    async function refreshLoop() {
      try {
        await loadLeaderboard();
      } catch (error) {
        updatedAt.textContent = `${t("error")}: ${error.message}`;
      }
    }

    document.querySelectorAll("[data-theme-button]").forEach((button) => {
      button.addEventListener("click", () => applyTheme(button.dataset.themeButton));
    });

    document.querySelectorAll("[data-lang-button]").forEach((button) => {
      button.addEventListener("click", () => {
        applyLanguage(button.dataset.langButton);
        refreshLoop();
      });
    });

    raceIdInput.addEventListener("change", () => {
      previousSignatures = null;
      refreshLoop();
    });

    applyTheme(theme);
    applyLanguage(language);
    refreshLoop();
    setInterval(refreshLoop, 1000);
  </script>
</body>
</html>
